<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e5004f"><title>StoreOps — mise à jour</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;background:#faf7f8;color:#241b20;margin:0;padding:24px}.wrap{max-width:520px;margin:15vh auto}.logo{width:64px;height:64px;border-radius:18px;background:#df2356;color:white;display:grid;place-items:center;font-size:36px;font-weight:800;margin-bottom:18px}h1{font-size:30px;margin:0 0 10px}p{font-size:17px;line-height:1.45;color:#71676c}.status{margin-top:20px;padding:16px;border-radius:16px;background:white;border:1px solid #eadfe3;font-weight:700}.error{color:#b00020;white-space:pre-wrap;overflow-wrap:anywhere}button{width:100%;min-height:54px;border:0;border-radius:16px;background:#df2356;color:white;font-size:17px;font-weight:800;margin-top:18px}</style></head><body><div class="wrap"><div class="logo">f</div><h1>Mise à jour StoreOps</h1><p>Quelques secondes pour charger une version propre sur ce téléphone.</p><div class="status" id="status">Nettoyage de l’ancienne version…</div><button id="retry" hidden>Réessayer</button></div><script>(async function(){const s=document.getElementById('status'),b=document.getElementById('retry');function txt(v){s.textContent=v}try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister().catch(()=>false)))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.indexOf('storeops-shell-')===0).map(k=>caches.delete(k)))}try{localStorage.removeItem('storeops_showcase_state_v7');localStorage.removeItem('storeops_user');sessionStorage.removeItem('storeops_boot_rescue_v153')}catch(_){}txt('Version propre chargée. Ouverture…');const u='/index.html?storeops_clean=1550&t='+Date.now();setTimeout(()=>location.replace(u),250)}catch(e){s.classList.add('error');txt('Impossible de nettoyer automatiquement : '+String(e&&e.message||e));b.hidden=false;b.onclick=()=>location.reload()}})();</script></body></html>
