[build]
  base = "."
  command = "cd frontend && ./netlify-build.sh"
  publish = "frontend"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/repair.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/runtime-config.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

# V1.84: modules are no longer re-downloaded on every navigation/reload.
# Five minutes keeps deploy propagation safe while stale-while-revalidate
# makes repeat visits effectively instant on store/mobile connections.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
