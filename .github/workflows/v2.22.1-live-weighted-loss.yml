name: V2.22.1 Live Weighted Loss Preview

on:
  pull_request:
    branches: [main]

jobs:
  live-weighted-loss:
    if: github.head_ref == 'storeops-v2.22.1-loss-unit-valuation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate existing weighted loss and Excel revaluation
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--franprix-storeops.netlify.app
        run: |
          set -euo pipefail
          code=""
          for i in $(seq 1 60); do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$PREVIEW_URL/api/health" || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          test "$code" = "200"

          curl -sS -H "x-demo-user: u-admin" \
            "$PREVIEW_URL/api/stores/val-fleuri/losses?date=2026-09-21" \
            -o /tmp/losses.json

          node - <<'NODE' >/tmp/melon.env
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/losses.json','utf8'));
          const rows=d.items||[];
          const melon=rows.find(x=>/melon/i.test(String(x.product_name||'')));
          console.error('LOSS SUMMARY',JSON.stringify(d.summary,null,2));
          console.error('MELON BEFORE',JSON.stringify(melon||null,null,2));
          if(!melon){console.log('FOUND=0');process.exit(0)}
          console.log('FOUND=1');
          console.log('EAN='+String(melon.ean||''));
          console.log('LOSS_ID='+String(melon.id||''));
          NODE
          cat /tmp/melon.env
          source /tmp/melon.env
          if [ "${FOUND:-0}" = "1" ]; then
            curl -sS -H "x-demo-user: u-admin" \
              "$PREVIEW_URL/api/stores/val-fleuri/products/$EAN?date=2026-09-21" \
              -o /tmp/product.json
            echo "PRODUCT CONTEXT"
            cat /tmp/product.json
          fi

          curl -sS -H "x-demo-user: u-admin" -H "content-type: application/json" -X POST \
            "$PREVIEW_URL/api/stores/val-fleuri/losses/export-excel?date=2026-09-21" \
            --data '{}' -o /tmp/export.json

          node - <<'NODE'
          const fs=require('fs');
          const losses=JSON.parse(fs.readFileSync('/tmp/losses.json','utf8'));
          const exp=JSON.parse(fs.readFileSync('/tmp/export.json','utf8'));
          const melon=(losses.items||[]).find(x=>/melon/i.test(String(x.product_name||'')))||null;
          const product=fs.existsSync('/tmp/product.json')?JSON.parse(fs.readFileSync('/tmp/product.json','utf8')):null;
          const xml=String(exp.file?.content||'');
          const result={
            melonFound:!!melon,
            before:melon&&{qty:melon.quantity,unit:melon.unit,retail:melon.total_retail_value,cost:melon.total_cost_value,valuationVersion:melon.valuation_version},
            product:product&&{name:product.name,productNumber:product.productNumber,retailPrice:product.price,retailUnit:product.retailUnit,retailPriceQuantity:product.retailPriceQuantity,cost:product.unitCost,costUnit:product.costUnit,costSource:product.costSource,costState:product.costState},
            revaluation:exp.revaluation,
            summary:exp.summary,
            has54000:xml.includes('>54000<'),
            hasUnitColumns:xml.includes('Unité prix vente')&&xml.includes('Unité coût')
          };
          console.log(JSON.stringify(result,null,2));
          if(!result.hasUnitColumns)process.exit(2);
          if(result.has54000)process.exit(3);
          NODE
