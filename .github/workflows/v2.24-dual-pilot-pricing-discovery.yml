name: V2.24 Dual Pilot Pricing Discovery

on:
  pull_request:
    branches: [main]

jobs:
  pricing-discovery:
    if: github.head_ref == 'storeops-v2.24-dual-pilot-pricing'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discover pricing sources for both pilots
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--franprix-storeops.netlify.app
        run: |
          set -euo pipefail
          code=""
          for i in $(seq 1 60); do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$PREVIEW_URL/api/health" || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          test "$code" = "200"

          for channel in 10001 10002; do
            curl -sS -H "x-demo-user: u-admin"               "$PREVIEW_URL/api/dynamics/probe?entity=RetailChannelPriceGroups&top=50&filter=RetailChannelId%20eq%20%27$channel%27"               -o "/tmp/groups-$channel.json"
          done

          curl -sS -H "x-demo-user: u-admin"             "$PREVIEW_URL/api/dynamics/probe?entity=ReleasedProductsV2&top=20&filter=ItemNumber%20eq%20%27HS-003577%27"             -o /tmp/base-price.json

          curl -sS -H "x-demo-user: u-admin"             "$PREVIEW_URL/api/dynamics/probe?entity=SalesPriceAgreements&top=50&filter=ItemNumber%20eq%20%27HS-003577%27"             -o /tmp/trade.json || true

          curl -sS -H "x-demo-user: u-admin"             "$PREVIEW_URL/api/dynamics/entities?q=SalesPrice"             -o /tmp/entities.json
          curl -sS -H "x-demo-user: u-admin"             "$PREVIEW_URL/api/dynamics/probe?entity=SalesPriceAgreements&top=50&filter=PriceCustomerGroupCode%20eq%20%27Franprix%27"             -o /tmp/trade-franprix.json || true
          curl -sS -H "x-demo-user: u-admin"             "$PREVIEW_URL/api/dynamics/probe?entity=SalesPriceAgreements&top=50&filter=PriceCustomerGroupCode%20eq%20%27Franp%20VF%27"             -o /tmp/trade-vf.json || true

          day=$(date -u +%F)
          curl -sS -G -H "x-demo-user: u-admin"             --data-urlencode "entity=RetailTransactionSalesTransBIEntities"             --data-urlencode "top=20"             --data-urlencode "filter=store eq 'FRP0002' and businessDate eq $day"             "$PREVIEW_URL/api/dynamics/probe" -o /tmp/trefle-sales-sample.json
          curl -sS -G -H "x-demo-user: u-admin"             --data-urlencode "entity=RetailTransactionSalesTransBIEntities"             --data-urlencode "top=20"             --data-urlencode "filter=store eq 'FRP0002' and businessDate eq $day and (netAmountInclTax lt -10000 or netAmountInclTax gt 10000)"             "$PREVIEW_URL/api/dynamics/probe" -o /tmp/trefle-sales-outliers.json
          curl -sS -H "x-demo-user: u-admin"             "$PREVIEW_URL/api/stores/trefle/business-pulse?date=$day&force=1"             -o /tmp/trefle-pulse.json
          curl -sS -G -H "x-demo-user: u-admin"             --data-urlencode "entity=RetailTransactionSalesTransBIEntities"             --data-urlencode "top=20"             --data-urlencode "filter=transactionId eq 'FRP0002-FRP2-POS2-1790066231670'"             "$PREVIEW_URL/api/dynamics/probe" -o /tmp/trefle-bad-transaction.json
          curl -sS -G -H "x-demo-user: u-admin"             --data-urlencode "entity=RetailTransactionSalesTransBIEntities"             --data-urlencode "top=20"             --data-urlencode "filter=store eq 'FRP0001' and businessDate eq $day and (netAmountInclTax lt -10000 or netAmountInclTax gt 10000)"             "$PREVIEW_URL/api/dynamics/probe" -o /tmp/vf-sales-outliers.json

          node - <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const groups={};
          for(const ch of ['10001','10002']){
            const p=read('/tmp/groups-'+ch+'.json');
            groups[ch]=(p.rows||[]).map(r=>({RetailChannelId:r.RetailChannelId,GroupCode:r.GroupCode,PriceGroupId:r.PriceGroupId,Name:r.Name}));
          }
          const base=read('/tmp/base-price.json');
          const trade=read('/tmp/trade.json');
          const entities=read('/tmp/entities.json');
          const baseRows=(base.rows||[]).map(r=>Object.fromEntries(Object.entries(r||{}).filter(([k,v])=>/item|salesprice|salesunit|pricequantity|date|tax|discount/i.test(k)&&v!==null&&v!=='')));
          const tradeRows=(trade.rows||[]).map(r=>Object.fromEntries(Object.entries(r||{}).filter(([k,v])=>/item|price|currency|quantity|unit|group|customer|warehouse|site|from|to|date/i.test(k)&&v!==null&&v!=='')));
          const entityRows=Array.isArray(entities)?entities:Array.isArray(entities.value)?entities.value:[];
          const entityNames=entityRows.map(x=>x.PublicCollectionName||x.PublicEntityName||x.Name||x.EntityName).filter(Boolean);
          const tf=read('/tmp/trade-franprix.json'),tv=read('/tmp/trade-vf.json');
          const salesSample=read('/tmp/trefle-sales-sample.json'),salesOutliers=read('/tmp/trefle-sales-outliers.json'),pulse=read('/tmp/trefle-pulse.json'),badTx=read('/tmp/trefle-bad-transaction.json'),vfOutliers=read('/tmp/vf-sales-outliers.json');
          const compact=p=>({ok:p.ok,rowCount:p.rowCount,error:p.error||p.message||null,rows:(p.rows||[]).slice(0,10).map(r=>Object.fromEntries(Object.entries(r||{}).filter(([k,v])=>/item|product|price|currency|quantity|unit|group|customer|warehouse|site|from|to|date/i.test(k)&&v!==null&&v!=='')))});
          const salesCompact=p=>({ok:p.ok,rowCount:p.rowCount,rows:(p.rows||[]).map(r=>({transactionId:r.transactionId,itemId:r.itemId,qty:r.qty,netAmountInclTax:r.netAmountInclTax,grossAmount:r.grossAmount,totalDiscountAmount:r.totalDiscountAmount,price:r.price,store:r.store,businessDate:r.businessDate}))});
          console.log(JSON.stringify({
            groups,
            base:{ok:base.ok,rowCount:base.rowCount,rows:baseRows},
            trade:{ok:trade.ok,rowCount:trade.rowCount,error:trade.error||trade.message||null,rows:tradeRows},
            tradeByGroup:{Franprix:compact(tf),FranpVF:compact(tv)},
            salesPriceEntities:entityNames,
            trefleSalesSample:salesCompact(salesSample),
            trefleSalesOutliers:salesCompact(salesOutliers),
            trefleBadTransaction:{ok:badTx.ok,rowCount:badTx.rowCount,rows:badTx.rows||[]},
            valFleuriSalesOutliers:salesCompact(vfOutliers),
            treflePulse:{status:pulse.status,businessDate:pulse.businessDate,ca:pulse.snapshot?.kpis?.netSales??null,tickets:pulse.snapshot?.kpis?.tickets??null,basket:pulse.snapshot?.kpis?.averageBasket??null,rows:pulse.diagnostics?.rows??null}
          },null,2));
          if(!groups['10001'].length)process.exit(2);
          if(!groups['10002'].length)process.exit(3);
          if(!baseRows.length)process.exit(4);
          NODE
