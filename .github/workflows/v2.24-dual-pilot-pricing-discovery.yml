name: V2.24 Dual Pilot Pricing & Stability
# preview-auth-refresh: demo

on:
  pull_request:
    branches: [main]

jobs:
  pricing-stability:
    if: github.head_ref == 'storeops-v2.24-dual-pilot-pricing'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and static contracts
        run: |
          node --check backend/services/dynamics.mjs
          node --check backend/services/dynamics-stock.mjs
          node --check backend/services/price-check.mjs
          node --check backend/services/dynamics-price.mjs
          node --check backend/services/commercial.mjs
          node --check backend/services/workforce-api.mjs
          node --check backend/server.mjs
          node --check frontend/js/manager-replenishment-v2.js
          node --check frontend/js/pages/commercial.js
          node --check frontend/js/pages/staffing.js
          node backend/tests/v224-operational-stability.mjs
          node backend/tests/quality-audit-access.mjs

      - name: Validate live dual-pilot pricing and restored APIs
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--franprix-storeops.netlify.app
        run: |
          set -euo pipefail
          code=""
          for i in $(seq 1 90); do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$PREVIEW_URL/api/health" || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          test "$code" = "200"

          for channel in 10001 10002; do
            curl -fsS -H "x-demo-user: u-admin"               "$PREVIEW_URL/api/dynamics/probe?entity=RetailChannelPriceGroups&top=50&filter=RetailChannelId%20eq%20%27$channel%27"               -o "/tmp/groups-$channel.json"
          done

          curl -fsS -H "x-demo-user: u-admin"             "$PREVIEW_URL/api/dynamics/probe?entity=ReleasedProductsV2&top=20&filter=ItemNumber%20eq%20%27HS-003577%27"             -o /tmp/base-price.json

          for store in val-fleuri trefle; do
            curl -fsS -H "x-demo-user: u-admin"               "$PREVIEW_URL/api/stores/$store/item-assistant/HS-003577"               -o "/tmp/item-$store.json"
            curl -fsS -H "x-demo-user: u-admin"               "$PREVIEW_URL/api/stores/$store/price-check/context/HS-003577"               -o "/tmp/price-$store.json"
            curl -fsS -H "x-demo-user: u-admin"               "$PREVIEW_URL/api/stores/$store/trade-agreements?limit=1000"               -o "/tmp/trade-$store.json"
          done

          curl -fsS -H "x-demo-user: u-tr"             "$PREVIEW_URL/api/stores/trefle/cash-opening" -o /tmp/cash.json
          curl -fsS -H "x-demo-user: u-tr"             "$PREVIEW_URL/api/stores/trefle/staffing" -o /tmp/staffing.json
          curl -fsS -H "x-demo-user: u-quality-audit"             "$PREVIEW_URL/api/stores/trefle/dlc?status=ALL" -o /tmp/quality-dlc.json

          node - <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const groups={};
          for(const ch of ['10001','10002']){
            const p=read('/tmp/groups-'+ch+'.json');
            groups[ch]=(p.rows||[]).map(r=>r.GroupCode).filter(Boolean);
          }
          const base=read('/tmp/base-price.json');
          const vf=read('/tmp/item-val-fleuri.json'),tr=read('/tmp/item-trefle.json');
          const pvf=read('/tmp/price-val-fleuri.json'),ptr=read('/tmp/price-trefle.json');
          const cash=read('/tmp/cash.json'),staff=read('/tmp/staffing.json'),dlc=read('/tmp/quality-dlc.json');
          const tvf=read('/tmp/trade-val-fleuri.json'),ttr=read('/tmp/trade-trefle.json');
          const out={
            groups,
            base:(base.rows||[]).map(r=>({item:r.ItemNumber,price:r.SalesPrice,unit:r.SalesUnitSymbol,qty:r.SalesPriceQuantity})),
            valFleuri:{item:vf.item?.productNumber,price:pvf.expectedUnitPrice,ean:pvf.product?.ean||null},
            trefle:{item:tr.item?.productNumber,price:ptr.expectedUnitPrice,ean:ptr.product?.ean||null},
            tradeAgreements:{
              valFleuri:{total:tvf.total,items:(tvf.items||[]).length,sample:(tvf.items||[]).slice(0,5).map(x=>x.itemNumber)},
              trefle:{total:ttr.total,items:(ttr.items||[]).length,sample:(ttr.items||[]).slice(0,5).map(x=>x.itemNumber)}
            },
            cash:{status:cash.summary?.status,lines:cash.opening?.lines?.length??0,sync:cash.sync},
            staffing:{status:staff.summary?.status,hasDay:!!staff.day,sync:staff.sync},
            qualityDlc:{items:(dlc.items||[]).length}
          };
          console.log(JSON.stringify(out,null,2));
          if(!groups['10001'].includes('Franprix'))process.exit(2);
          if(!groups['10002'].includes('Franprix'))process.exit(3);
          if(!(base.rows||[]).some(r=>r.ItemNumber==='HS-003577'))process.exit(4);
          if(vf.item?.productNumber!=='HS-003577'||tr.item?.productNumber!=='HS-003577')process.exit(5);
          if(pvf.product?.productNumber!=='HS-003577'||ptr.product?.productNumber!=='HS-003577')process.exit(6);
          const expectedItems=['HS-003574','HS-003577','HS-006719'];
          for(const [label,payload] of [['Val Fleuri',tvf],['Trèfle',ttr]]){
            if(Number(payload.total)<69)process.exit(10);
            for(const item of expectedItems)if(!(payload.items||[]).some(x=>x.itemNumber===item))process.exit(11);
            if(payload.hasMore)process.exit(12);
          }
          if(!cash.summary)process.exit(7);
          if(!staff.summary)process.exit(8);
          if(!Array.isArray(dlc.items))process.exit(9);
          NODE
