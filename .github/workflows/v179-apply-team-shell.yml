name: V1.79 Apply Team Shell
on:
  push:
    branches: [storeops-v1.79-manager-experience]
    paths: ['.github/workflows/v179-apply-team-shell.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: storeops-v1.79-manager-experience}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Wire Team cockpit
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/index.html');s=p.read_text()
          if '/manager-team.css' not in s:s=s.replace('<link rel="stylesheet" href="/manager-scan.css">','<link rel="stylesheet" href="/manager-scan.css"><link rel="stylesheet" href="/manager-team.css">')
          s=s.replace('<button data-page="staffing">Équipe</button>','<button data-page="managerTeam">Équipe</button>')
          section='<section class="page" id="managerTeamPage"><div id="managerTeamContent"></div></section>'
          if 'id="managerTeamPage"' not in s:s=s.replace('<section class="page" id="managerJourneyPage">',section+'\n<section class="page" id="managerJourneyPage">')
          p.write_text(s)

          p=Path('frontend/js/app.js');s=p.read_text()
          imp="import { renderManagerTeam } from './pages/manager-team.js';"
          if imp not in s:s=s.replace("import { renderManagerScan } from './pages/manager-scan.js';", "import { renderManagerScan } from './pages/manager-scan.js';\n"+imp)
          old="function managerTabFor(page){if(page==='today')return'today';if(page==='managerScan')return'managerScan';if(page==='staffing')return'staffing';return'managerMore'}"
          new="function managerTabFor(page){if(page==='today')return'today';if(page==='managerScan')return'managerScan';if(page==='managerTeam'||page==='staffing')return'managerTeam';return'managerMore'}"
          s=s.replace(old,new)
          if "if(page==='managerTeam')return renderManagerTeam();" not in s:s=s.replace("if(page==='managerScan')return renderManagerScan();", "if(page==='managerScan')return renderManagerScan();if(page==='managerTeam')return renderManagerTeam();")
          p.write_text(s)

          p=Path('netlify/functions/api.mts');s=p.read_text()
          if "'D365_STORE_SUPPLY_WAREHOUSES'" not in s:
              s=s.replace("'D365_STOCK_ENTITY','D365_STOCK_PRODUCT_FIELD','D365_STOCK_NAME_FIELD','D365_STOCK_EAN_FIELD','D365_STOCK_WAREHOUSE_FIELD','D365_STOCK_AVAILABLE_FIELD','D365_STOCK_PHYSICAL_FIELD','D365_STORE_WAREHOUSES',", "'D365_STOCK_ENTITY','D365_STOCK_PRODUCT_FIELD','D365_STOCK_NAME_FIELD','D365_STOCK_EAN_FIELD','D365_STOCK_WAREHOUSE_FIELD','D365_STOCK_AVAILABLE_FIELD','D365_STOCK_PHYSICAL_FIELD','D365_STORE_WAREHOUSES','D365_STORE_SUPPLY_WAREHOUSES',")
          p.write_text(s)
          PY
          node --check frontend/js/app.js
          node --check frontend/js/pages/manager-team.js
          node --check netlify/functions/api.mts
          grep -q 'data-page="managerTeam"' frontend/index.html
      - name: Commit Team shell
        run: |
          git config user.name 'indepadib'
          git config user.email '55211714+indepadib@users.noreply.github.com'
          git add frontend/index.html frontend/js/app.js netlify/functions/api.mts
          git commit -m 'feat(v1.79): wire manager Team cockpit and supply mapping'
          git push origin HEAD:storeops-v1.79-manager-experience
