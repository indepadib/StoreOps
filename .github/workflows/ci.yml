name: StoreOps CI

on:
  push:
    branches:
      - main
      - storeops-v1.4-integration
      - storeops-v1.4.3-quality-governance
  pull_request:
    branches:
      - main
      - storeops-v1.4-integration

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check backend and frontend
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find backend frontend/js -type f \( -name '*.mjs' -o -name '*.js' \) | sort)

      - name: Cash closing engine unit test
        env:
          D365_MODE: simulated
          STOREOPS_DB: /tmp/storeops-cash-ci.db
          STOREOPS_MEDIA_DIR: /tmp/storeops-cash-media
        run: node backend/tests/cash-engine.mjs

      - name: Start StoreOps API
        shell: bash
        env:
          AUTH_MODE: demo
          D365_MODE: simulated
          PORT: 8787
          STOREOPS_DB: /tmp/storeops-ci.db
          STOREOPS_MEDIA_DIR: /tmp/storeops-media
        run: |
          node backend/server.mjs > /tmp/storeops-api.log 2>&1 &
          echo $! > /tmp/storeops-api.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/storeops-api.log
          exit 1

      - name: Cash closing API integration test
        env:
          STOREOPS_TEST_BASE: http://127.0.0.1:8787
        run: node backend/tests/cash-api.mjs

      - name: Workflow, incident, permissions and governance smoke test
        env:
          STOREOPS_TEST_BASE: http://127.0.0.1:8787
        run: node backend/tests/smoke.mjs

      - name: Stop StoreOps API
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/storeops-api.pid ]; then
            kill "$(cat /tmp/storeops-api.pid)" || true
          fi
