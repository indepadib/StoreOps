name: StoreOps CI

on:
  push:
    branches:
      - main
      - storeops-v1.4-integration
      - storeops-v1.4.3-quality-governance
  pull_request:
    branches:
      - main
      - storeops-v1.4-integration

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check backend and frontend
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do node --check "$file"; done < <(find backend frontend/js -type f \( -name '*.mjs' -o -name '*.js' \) | sort)
          node --check frontend/sw.js
      - name: Version contract test
        run: node backend/tests/version-contract.mjs
      - name: PWA shell integrity test
        run: node backend/tests/pwa-shell.mjs
      - name: Blind inventory presentation test
        run: node backend/tests/inventory-privacy.mjs
      - name: Quality floor-control draft test
        run: node backend/tests/quality-draft.mjs
      - name: Network control-tower risk test
        run: node backend/tests/network-risk.mjs
      - name: Today receiving and quality signals test
        run: node backend/tests/today-signals.mjs
      - name: Evidence-safe incident resolution policy test
        run: node backend/tests/incident-resolution-policy.mjs
      - name: Maintenance equipment model test
        run: node backend/tests/maintenance-model.mjs
      - name: Store Health V2 model test
        run: node backend/tests/store-health.mjs
      - name: Manager journey decision test
        run: node backend/tests/manager-journey.mjs
      - name: Manager day compliance model test
        run: node backend/tests/manager-compliance.mjs
      - name: Mobile scan and manual entry coverage test
        run: node backend/tests/mobile-dual-entry.mjs
      - name: Val Fleuri pilot operating profile test
        env: { STOREOPS_DB: /tmp/storeops-pilot-profile-ci.db }
        run: node backend/tests/pilot-profile.mjs
      - name: Pilot source decoupling test
        env: { STOREOPS_DB: /tmp/storeops-pilot-sources-ci.db }
        run: node backend/tests/pilot-source-decoupling.mjs
      - name: Manual cash-closing fallback test
        env: { STOREOPS_DB: /tmp/storeops-manual-cash-fallback-ci.db }
        run: node backend/tests/manual-cash-closing-fallback.mjs
      - name: Local pilot authentication test
        env: { STOREOPS_DB: /tmp/storeops-local-auth-ci.db }
        run: node backend/tests/local-auth.mjs
      - name: Entra SPA PKCE security contract test
        run: node backend/tests/entra-spa-contract.mjs
      - name: Pricing configuration and hardening tests
        run: |
          node backend/tests/pricing-config.mjs
          node backend/tests/pricing-hardening.mjs
          node backend/tests/commercial-operational-filter.mjs
          node backend/tests/commercial-lifecycle.mjs
      - name: Dynamics diagnostics engine test
        run: node backend/tests/dynamics-diagnostics.mjs
      - name: Cash showcase engine test
        run: node backend/tests/showcase-cash.mjs
      - name: Cash opening showcase test
        run: node backend/tests/showcase-cash-opening.mjs
      - name: Cold chain showcase test
        run: node backend/tests/showcase-cold-chain.mjs
      - name: Staffing showcase test
        run: node backend/tests/showcase-staffing.mjs
      - name: Handover showcase test
        run: node backend/tests/showcase-handover.mjs
      - name: Receiving quality showcase test
        run: node backend/tests/showcase-receipts.mjs
      - name: Loss showcase engine test
        run: node backend/tests/showcase-loss.mjs
      - name: Showcase DLC to loss automation test
        run: node backend/tests/showcase-dlc-loss.mjs
      - name: Staffing readiness engine test
        env: { STOREOPS_DB: /tmp/storeops-staffing-ci.db, STOREOPS_MEDIA_DIR: /tmp/storeops-staffing-media, D365_MODE: simulated }
        run: node backend/tests/staffing-engine.mjs
      - name: Cold chain readiness engine test
        env: { D365_MODE: simulated, STOREOPS_DB: /tmp/storeops-cold-chain-ci.db, STOREOPS_MEDIA_DIR: /tmp/storeops-cold-chain-media }
        run: node backend/tests/cold-chain-engine.mjs
      - name: Cash opening readiness engine test
        env: { D365_MODE: simulated, STOREOPS_DB: /tmp/storeops-cash-opening-ci.db, STOREOPS_MEDIA_DIR: /tmp/storeops-cash-opening-media }
        run: node backend/tests/cash-opening-engine.mjs
      - name: Cash closing engine unit test
        env: { D365_MODE: simulated, STOREOPS_DB: /tmp/storeops-cash-ci.db, STOREOPS_MEDIA_DIR: /tmp/storeops-cash-media }
        run: node backend/tests/cash-engine.mjs
      - name: Loss and waste engine unit test
        env: { STOREOPS_DB: /tmp/storeops-loss-ci.db, STOREOPS_MEDIA_DIR: /tmp/storeops-loss-media }
        run: node backend/tests/loss-engine.mjs
      - name: DLC to loss source automation test
        env: { STOREOPS_DB: /tmp/storeops-dlc-loss-ci.db, STOREOPS_MEDIA_DIR: /tmp/storeops-dlc-loss-media }
        run: node backend/tests/loss-source-dlc.mjs
      - name: Start StoreOps API
        shell: bash
        env: { AUTH_MODE: demo, D365_MODE: simulated, PORT: 8787, STOREOPS_DB: /tmp/storeops-ci.db, STOREOPS_MEDIA_DIR: /tmp/storeops-media }
        run: |
          node backend/server.mjs > /tmp/storeops-api.log 2>&1 &
          echo $! > /tmp/storeops-api.pid
          for i in {1..20}; do if curl --fail --silent http://127.0.0.1:8787/api/health > /tmp/health.json; then cat /tmp/health.json; exit 0; fi; sleep 1; done
          cat /tmp/storeops-api.log; exit 1
      - name: Runtime version API integration test
        env: { STOREOPS_TEST_BASE: http://127.0.0.1:8787 }
        run: node backend/tests/version-api.mjs
      - name: Dynamics diagnostics API integration test
        env: { STOREOPS_TEST_BASE: http://127.0.0.1:8787 }
        run: node backend/tests/dynamics-diagnostics-api.mjs
      - name: Dynamics stock store mapping API test
        env: { STOREOPS_TEST_BASE: http://127.0.0.1:8787 }
        run: node backend/tests/dynamics-stock-api.mjs
      - name: Staffing readiness API integration test
        env: { STOREOPS_TEST_BASE: http://127.0.0.1:8787 }
        run: node backend/tests/staffing-api.mjs
      - name: Cold chain API integration test
        env: { STOREOPS_TEST_BASE: http://127.0.0.1:8787 }
        run: node backend/tests/cold-chain-api.mjs
      - name: Cash opening API integration test
        env: { STOREOPS_TEST_BASE: http://127.0.0.1:8787 }
        run: node backend/tests/cash-opening-api.mjs
      - name: Cash closing API integration test
        env: { STOREOPS_TEST_BASE: http://127.0.0.1:8787 }
        run: node backend/tests/cash-api.mjs
      - name: Loss and waste API integration test
        env: { STOREOPS_TEST_BASE: http://127.0.0.1:8787 }
        run: node backend/tests/loss-api.mjs
      - name: Workflow, incident, permissions and governance smoke test
        env: { STOREOPS_TEST_BASE: http://127.0.0.1:8787 }
        run: node backend/tests/smoke-v112.mjs
      - name: Stop StoreOps API
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/storeops-api.pid ]; then kill "$(cat /tmp/storeops-api.pid)" || true; fi
