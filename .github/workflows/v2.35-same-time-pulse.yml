name: V2.36 Operational Stability

on:
  push:
    branches: [main, storeops-v2.36-operational-stability]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  same-time-pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check backend/services/dynamics-sales.mjs
          node --check backend/services/business-pulse.mjs
          node --check backend/services/dynamics-staff-performance.mjs
          node --check backend/services/dynamics-loyalty.mjs
          node --check frontend/js/pages/manager-team.js
          node --check frontend/js/pages/inventory.js
          node --check frontend/js/pages/manager-home.js
          node --check frontend/js/pages/manager-performance.js
          node --check backend/services/cool-save.mjs
          node --check backend/services/store-growth-api.mjs
          node --check backend/services/product-cache.mjs
          node --check backend/services/released-product-sourcing.mjs
          node --check frontend/js/pages/cool-save.js
          node --check frontend/js/pages/sell-through.js
          node --check backend/services/cool-save-orders.mjs
          node --check backend/services/cool-save-integration-api.mjs
          node --check backend/services/released-product-sourcing.mjs
          node --check backend/services/dynamics-stock.mjs
          node --check backend/services/sell-through.mjs
          node --check backend/services/glovo-availability.mjs
          node --check backend/services/dynamics.mjs
          node --check backend/services/commercial.mjs
          node --check backend/services/stock-signals.mjs
          node --check backend/services/business-pulse.mjs
          node --check frontend/js/manager-replenishment-v2.js
          node --check frontend/js/warehouse-control.js
          node --check frontend/js/enhancements-entry.js
          node --check frontend/js/pages/channel-availability.js
      - name: Same-time comparison contract
        run: node backend/tests/v235-same-time-pulse.mjs
      - name: Cool Save publish/idempotency
        run: node backend/tests/v235-cool-save-flow.mjs
      - name: Product labels
        run: node backend/tests/v235-product-labels.mjs
      - name: Article identity and Cool Save model
        run: node backend/tests/v235-product-identity-cool-save.mjs
      - name: Cool Save external order lifecycle
        run: node backend/tests/v235-cool-save-external-orders.mjs
      - name: Operational identity UX and performance
        run: node backend/tests/v236-operational-stability.mjs
      - name: StaffId and customer recruitment attribution
        run: node backend/tests/v236-cashier-recruitment-attribution.mjs
      - name: Inventory unit counting regression
        run: node backend/tests/v230-inventory-unit-policy.mjs
      - name: Business Pulse regression
        run: node backend/tests/business-pulse.mjs
      - name: Store Action Engine regression
        run: node backend/tests/v233-store-action-engine.mjs
