name: StoreOps Integration Readiness Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check frontend/js/integration-readiness.js
      - run: node --check frontend/js/pages/system.js
      - run: node backend/tests/integration-readiness.mjs
