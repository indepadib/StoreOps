name: V2.04 Local-First Today Contract

on:
  push:
    branches: [storeops-v2.04-local-first-today]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies
        run: npm install --ignore-scripts
      - name: Syntax
        run: |
          node --check backend/services/manager-inbox-batch.mjs
          node --check frontend/js/pages/manager-home.js
          node --check frontend/js/auth-entry.js
      - name: Typecheck Netlify bridge
        run: npx tsc -p tsconfig.netlify.json
      - name: V2.04 local-first contract
        run: node backend/tests/v204-local-first-today.mjs
      - name: V2.03 light enrichment regression
        run: node backend/tests/v203-manager-light-enrichment.mjs
      - name: Release coherence regression
        run: node backend/tests/v196-release-candidate.mjs
      - name: Production asset regression
        run: node backend/tests/v200-production-assets.mjs
