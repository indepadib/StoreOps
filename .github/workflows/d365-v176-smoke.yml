name: D365 V1.76 Banana Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  banana-smoke:
    if: github.head_ref == 'storeops-v1.76-promo-offer-driven'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for V1.76 deploy preview
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          BASE="https://deploy-preview-${PR_NUMBER}--franprix-storeops.netlify.app"
          ready=0
          for i in $(seq 1 60); do
            code=$(curl -sS -o /tmp/banana.json -w '%{http_code}' --max-time 45 "$BASE/smoke/v176-promo?ean=4012" || true)
            if [ "$code" = "200" ] && grep -q '"expectedUnitPrice"' /tmp/banana.json 2>/dev/null; then ready=1; break; fi
            sleep 5
          done
          echo "HTTP $code"
          cat /tmp/banana.json 2>/dev/null || true
          [ "$ready" = "1" ]

      - name: Assert banana promotion
        run: |
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/banana.json','utf8'));
          if(x.product?.productNumber!=='HS-003584')throw new Error(`Unexpected item ${x.product?.productNumber}`);
          if(Number(x.basePrice)!==19.9)throw new Error(`Unexpected base price ${x.basePrice}`);
          if(Number(x.expectedUnitPrice)!==17.9)throw new Error(`Expected 17.9, got ${x.expectedUnitPrice}`);
          if(x.sources?.promotion!=='LIVE')throw new Error(`Promotion source is ${x.sources?.promotion}`);
          if(!(x.promoLabel||[]).some(p=>p.offerId==='5001-000091'))throw new Error('Offer 5001-000091 not active');
          console.log('BANANA_PROMO_OK',JSON.stringify({base:x.basePrice,expected:x.expectedUnitPrice,offers:x.promoLabel}));
          NODE
