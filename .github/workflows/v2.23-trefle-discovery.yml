name: V2.23 Trèfle D365 Discovery

on:
  pull_request:
    branches: [main]

jobs:
  discover:
    if: github.head_ref == 'storeops-v2.23-trefle-business-pulse'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discover store/channel entities and sales identifiers
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--franprix-storeops.netlify.app
        run: |
          set -euo pipefail
          code=""
          for i in $(seq 1 60); do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$PREVIEW_URL/api/health" || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done
          test "$code" = "200"

          for q in store retail channel; do
            curl -sS -H "x-demo-user: u-admin" "$PREVIEW_URL/api/dynamics/entities?q=$q" -o "/tmp/entities-$q.json"
          done
          curl -sS -H "x-demo-user: u-admin" "$PREVIEW_URL/api/dynamics/probe?entity=RetailTransactionSalesTransBIEntities&top=20&extra=cross-company%3Dtrue" -o /tmp/sales.json
          curl -sS -H "x-demo-user: u-admin" "$PREVIEW_URL/api/dynamics/probe?entity=RetailTransactionSalesTransBIEntities&top=20&filter=store%20ne%20%27FRP0001%27&extra=cross-company%3Dtrue" -o /tmp/sales-other.json
          for entity in RetailStore RetailStoreTableBiEntity RetailChannel RetailChannelTableBiEntity DimAttributeRetailStore; do
            curl -sS -H "x-demo-user: u-admin" "$PREVIEW_URL/api/dynamics/probe?entity=$entity&top=20&extra=cross-company%3Dtrue" -o "/tmp/probe-$entity.json" || true
          done

          node - <<'NODE'
          const fs=require('fs');
          const pickName=x=>x?.PublicEntityName||x?.PublicCollectionName||x?.Name||x?.EntityName||x?.DataEntityName||null;
          for(const q of ['store','retail','channel']){
            const data=JSON.parse(fs.readFileSync('/tmp/entities-'+q+'.json','utf8'));
            const rows=Array.isArray(data)?data:Array.isArray(data?.value)?data.value:[];
            const names=[...new Set(rows.map(pickName).filter(Boolean))].slice(0,100);
            console.log('\nENTITY SEARCH',q,JSON.stringify(names,null,2));
          }
          const sales=JSON.parse(fs.readFileSync('/tmp/sales.json','utf8'));
          console.log('\nSALES SAMPLE',JSON.stringify(sales,null,2));
          const other=JSON.parse(fs.readFileSync('/tmp/sales-other.json','utf8'));
          const compactSales=(other.rows||[]).map(r=>({store:r.store,Channel:r.Channel,InventLocationId:r.InventLocationId,terminalId:r.terminalId,transactionId:r.transactionId,businessDate:r.businessDate,dataAreaId:r.dataAreaId}));
          console.log('\nOTHER STORE SALES',JSON.stringify(compactSales,null,2));
          for(const entity of ['RetailStore','RetailStoreTableBiEntity','RetailChannel','RetailChannelTableBiEntity','DimAttributeRetailStore']){
            const file='/tmp/probe-'+entity+'.json';
            if(!fs.existsSync(file))continue;
            const data=JSON.parse(fs.readFileSync(file,'utf8')),rows=data.rows||[];
            console.log('\nRAW PROBE',entity,JSON.stringify({ok:data.ok,code:data.code,error:data.error,message:data.message,rowCount:data.rowCount,filter:data.filter},null,2));
            const compact=rows.map(row=>{
              const hit={};
              for(const [k,v] of Object.entries(row||{})){
                if(/store|channel|name|warehouse|location|operating|organization|number|id/i.test(k)&&v!==''&&v!==null)hit[k]=v;
              }
              return hit;
            });
            const trefle=compact.filter(row=>/tr[eè]fle|trefle/i.test(JSON.stringify(row)));
            console.log('\nPROBE',entity,'TREFLE',JSON.stringify(trefle,null,2));
            console.log('PROBE',entity,'ROWS',JSON.stringify(compact,null,2));
          }
          NODE
