name: V1.99 Exception-First Director Contract

on:
  push:
    branches: [storeops-v1.99-exception-first-director]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check frontend/js/director-exception-first.js
          node --check frontend/js/enhancements-entry.js
          node --check frontend/js/auth-entry.js
          node --check frontend/js/boot-classic.js
          node --check backend/tests/v198-action-first-mobile.mjs
          node --check backend/tests/v199-exception-first-director.mjs
      - name: V1.99 exception-first Director contract
        run: node backend/tests/v199-exception-first-director.mjs
      - name: V1.98 action-first regression
        run: node backend/tests/v198-action-first-mobile.mjs
      - name: V1.97 instant Today regression
        run: STOREOPS_DB=/tmp/storeops-v199-v197.db node backend/tests/v197-mobile-instant-today.mjs
      - name: Release coherence regression
        run: node backend/tests/v196-release-candidate.mjs
      - name: Current frontend build preserves V1.99 behavior
        shell: bash
        run: |
          rm -rf /tmp/storeops-v199-publish
          cp -R frontend /tmp/storeops-v199-publish
          cd /tmp/storeops-v199-publish
          BUILD_KEY=$(sed -n "s/.*const BUILD='\([0-9][0-9]*\)'.*/\1/p" js/auth-entry.js | head -1)
          BUILD_LABEL=$(sed -n "s/.*BUILD_LABEL='\([^']*\)'.*/\1/p" js/auth-entry.js | head -1)
          test -n "$BUILD_KEY"
          test -n "$BUILD_LABEL"
          STOREOPS_API_BASE=https://storeops.ma STOREOPS_RELEASE_BUILD="$BUILD_KEY" sh ./netlify-build.sh
          grep -q 'apiBase":"https://storeops.ma"' runtime-config.js
          grep -q "BUILD='$BUILD_LABEL'" runtime-config.js
          grep -q "/js/auth-entry.js?v=$BUILD_KEY" index.html
          grep -q 'mobile-v199.css' js/enhancements-entry.js
          grep -q 'director-exception-first.js' js/enhancements-entry.js
