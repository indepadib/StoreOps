name: V1.79 Finalize Wiring
on:
  push:
    branches: [storeops-v1.79-manager-experience]
    paths: ['.github/workflows/v179-finalize-wire.yml']
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: storeops-v1.79-manager-experience}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Final diagnostics wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/services/dynamics.mjs');s=p.read_text()
          anchor="      purchaseOrderLineEntity:c.receiving?.lineEntity||null,"
          extra="""      purchaseOrderLineEntity:c.receiving?.lineEntity||null,\n      assortmentEntity:process.env.D365_ASSORTMENT_ENTITY||null,\n      categoryEntity:process.env.D365_CATEGORY_ENTITY||'ProcurementProductCategories',\n      productCategoryAssignmentEntity:process.env.D365_PRODUCT_CATEGORY_ASSIGNMENT_ENTITY||'ProductCategoryAssignments',\n      salesEntity:process.env.D365_SALES_ENTITY||'RetailTransactionSalesTransBIEntities',\n      stockBatchField:c.stock?.batchField||null,\n      stockLocationField:c.stock?.locationField||null,\n      stockStatusField:c.stock?.statusField||null,\n      storeSupplyWarehouses:c.stock?.supplyWarehouses||{},"""
          if 'assortmentEntity:process.env.D365_ASSORTMENT_ENTITY' not in s:s=s.replace(anchor,extra)
          p.write_text(s)
          PY
          node --check backend/services/dynamics.mjs
      - name: Commit final diagnostics wiring
        run: |
          git config user.name 'indepadib'
          git config user.email '55211714+indepadib@users.noreply.github.com'
          git add backend/services/dynamics.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(v1.79): expose merchandising sales and stock dimension readiness'
          git push origin HEAD:storeops-v1.79-manager-experience
