name: V2.03 Performance Observatory Contract

on:
  push:
    branches: [storeops-v2.03-performance-observatory]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check frontend/js/api.js
          node --check frontend/js/auth-entry.js
          node --check frontend/js/enhancements-entry.js
          node --check frontend/js/performance-observatory.js
      - name: V2.03 observatory contract
        run: node backend/tests/v203-performance-observatory.mjs
      - name: V2.02 cold snapshot regression
        run: node backend/tests/v202-single-query-cold-snapshot.mjs
      - name: V2.01 cold-start regression
        run: node backend/tests/v201-cold-start-fast.mjs
      - name: V2.00 asset regression
        run: node backend/tests/v200-production-assets.mjs
