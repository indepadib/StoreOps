name: V2.02 Single Query Cold Snapshot Contract

on:
  push:
    branches: [storeops-v2.02-single-query-cold-snapshot]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies
        run: npm install --ignore-scripts
      - name: Typecheck Netlify bridge
        run: npx tsc -p tsconfig.netlify.json
      - name: V2.02 single-query cold snapshot contract
        run: node backend/tests/v202-single-query-cold-snapshot.mjs
      - name: V2.01 cold-start regression
        run: node backend/tests/v201-cold-start-fast.mjs
      - name: V1.84 persistence regression
        run: node backend/tests/v184-performance-p0.mjs
      - name: Public backend regression
        run: node backend/tests/netlify-public-backend.mjs
