name: V1.86 Manager Inbox Batch

on:
  push:
    branches: [storeops-v1.86-manager-inbox-batch]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check backend/services/manager-inbox-batch.mjs
          node --check backend/services/business-pulse-api.mjs
          node --check frontend/js/pages/manager-home.js
      - name: Batch contract
        run: node backend/tests/v186-manager-inbox-batch.mjs
      - name: Fast path regression
        run: node backend/tests/v185-manager-home-fast.mjs
      - name: Performance P0 regression
        run: node backend/tests/v184-performance-p0.mjs
      - name: Static guards
        run: |
          grep -q "/manager-inbox-batch" frontend/js/pages/manager-home.js
          grep -q "httpFanout:0" backend/services/manager-inbox-batch.mjs
          grep -q "commercialReadOnly:true" backend/services/manager-inbox-batch.mjs
          ! grep -q "syncCommercialControls" backend/services/manager-inbox-batch.mjs
