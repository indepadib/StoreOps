name: V2.21.1 Fast Pulse Preview
# preview-env-refresh: stock-live

on:
  pull_request:
    branches: [main]

jobs:
  live-stockout:
    if: github.head_ref == 'storeops-v2.21.1-fast-pulse'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for preview and validate 30-day stockout rule
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--franprix-storeops.netlify.app
        run: |
          set -euo pipefail
          code=""
          for i in $(seq 1 60); do
            start=$(date +%s)
            code=$(curl -sS -o /tmp/pulse.json -w "%{http_code}" "$PREVIEW_URL/api/stores/val-fleuri/business-pulse?force=1" || true)
            end=$(date +%s)
            if [ "$code" = "200" ]; then echo "Pulse seconds: $((end-start))"; break; fi
            echo "Attempt $i: HTTP $code"
            sleep 5
          done
          test "$code" = "200"
          stock_start=$(date +%s)
          curl -sS "$PREVIEW_URL/api/stores/val-fleuri/business-pulse/stockouts?force=1" -o /tmp/stockouts.json
          stock_end=$(date +%s)
          echo "Stockout refresh seconds: $((stock_end-stock_start))"
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/pulse.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/stockouts.json','utf8'));
          const safe={
            pulseStatus:p.status,
            pulseStock:p.stock,
            ca:p.snapshot?.kpis?.netSales ?? null,
            stockoutStatus:s.status,
            stockoutCount:s.summary?.outOfStock ?? null,
            stockoutMethod:s.summary?.ruptureMethod ?? null,
            soldProducts30d:s.summary?.salesWindowProducts ?? null,
            stockSource:s.source
          };
          console.log(JSON.stringify(safe,null,2));
          if(p.status!=='READY')process.exit(2);
          if(p.stock?.ruptureReady===true)process.exit(3);
          if(s.status!=='READY')process.exit(4);
          if(s.summary?.ruptureMethod!=='SALES_30D_ZERO_STOCK')process.exit(5);
          if(!Number.isFinite(Number(s.summary?.outOfStock)))process.exit(6);
          NODE
