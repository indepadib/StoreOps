name: V2.20 Live Business Pulse

on:
  push:
    branches: [storeops-v2.20-business-pulse-live]
  pull_request:
    branches: [main]

jobs:
  business-pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check backend/services/d365-sales-mapping.mjs
          node --check backend/services/dynamics-sales.mjs
          node --check backend/services/business-pulse-api.mjs
      - name: Live-sales fallback contract
        run: node backend/tests/v220-business-pulse-live.mjs
      - name: Existing Business Pulse contracts
        run: |
          node backend/tests/business-pulse.mjs
          node backend/tests/v207-sales-mapping-studio.mjs
      - name: Safety
        run: |
          grep -q "salesStoreIdentifiers" backend/services/d365-sales-mapping.mjs
          grep -q "dateFilterMode:mode" backend/services/dynamics-sales.mjs
          grep -q "ensureD365SalesAutoConnected" backend/services/business-pulse-api.mjs
