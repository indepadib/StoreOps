name: StoreOps 2.39.1 One Shot Production Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-deploy-now.yml'

concurrency:
  group: storeops-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      NETLIFY_SITE_ID: c0169294-465a-47ce-8ad7-4a290f790cf6
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release and scanner contracts
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NETLIFY_AUTH_TOKEN:-}" || { echo "::error::NETLIFY_AUTH_TOKEN missing"; exit 1; }
          npm install --ignore-scripts --no-audit --no-fund
          npx tsc -p tsconfig.netlify.json
          node --check frontend/js/mobile-barcode.js
          node --check frontend/js/pages/network.js
          node backend/tests/version-contract.mjs
          node backend/tests/mobile-dual-entry.mjs
      - name: Deploy verified main to storeops.ma
        shell: bash
        run: |
          set -euo pipefail
          echo "Deploying StoreOps 2.39.1 commit $(git rev-parse HEAD)"
          npx --yes netlify-cli@latest deploy --build --prod --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --message "StoreOps 2.39.1 verified main $(git rev-parse HEAD)"
      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..24}; do
            if curl --fail --silent --show-error https://storeops.ma/api/health > /tmp/storeops-health.json; then
              cat /tmp/storeops-health.json
              grep -q '"version":"2.39.1"' /tmp/storeops-health.json && exit 0
            fi
            sleep 5
          done
          echo "::error::storeops.ma did not expose StoreOps 2.39.1 after deploy"
          exit 1
