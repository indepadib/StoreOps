name: V1.68 D365 Deploy Preview Smoke

on:
  pull_request:
    branches: [main]

jobs:
  d365-read-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Netlify Deploy Preview
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          BASE="https://deploy-preview-${PR_NUMBER}--franprix-storeops.netlify.app"
          for i in {1..60}; do
            if curl -fsS "$BASE/api/health" > /tmp/health.json; then
              node -e "const j=require('/tmp/health.json');if(j.authMode!=='demo'||j.dynamicsMode!=='live')process.exit(1)" && exit 0
            fi
            sleep 5
          done
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Validate D365 transport and read switches
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          BASE="https://deploy-preview-${PR_NUMBER}--franprix-storeops.netlify.app"
          curl -fsS -H 'x-demo-user: u-admin' "$BASE/api/dynamics/health" > /tmp/d365-health.json
          node - <<'NODE'
          const j=require('/tmp/d365-health.json');
          if(!j.connected || j.mode!=='LIVE') throw new Error(`D365 transport not live: ${JSON.stringify(j)}`);
          for(const d of ['product','stock','price','promotion']) if(j.readModes?.[d]!=='live') throw new Error(`${d} READ switch is not live`);
          console.log('D365 transport + read switches: OK');
          NODE

      - name: Validate Article EAN mapping
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          BASE="https://deploy-preview-${PR_NUMBER}--franprix-storeops.netlify.app"
          curl -fsS -H 'x-demo-user: u-admin' "$BASE/api/products/5449000206770" > /tmp/product.json
          node - <<'NODE'
          const j=require('/tmp/product.json');
          if(j.productNumber!=='HS-004873') throw new Error(`Unexpected product mapping: ${JSON.stringify(j)}`);
          if(j.source!=='D365') throw new Error(`Product is not D365 sourced: ${JSON.stringify(j)}`);
          console.log('EAN 5449000206770 -> HS-004873: OK');
          NODE

      - name: Validate Val Fleuri stock through blind inventory snapshot
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          BASE="https://deploy-preview-${PR_NUMBER}--franprix-storeops.netlify.app"
          curl -fsS -H 'x-demo-user: u-admin' -H 'content-type: application/json' \
            -d '{"type":"TARGETED","zone":"V1.68 CI D365","comment":"Temporary deploy-preview stock validation"}' \
            "$BASE/api/stores/val-fleuri/inventory" > /tmp/inventory.json
          INV_ID=$(node -p "require('/tmp/inventory.json').id")
          curl -fsS -H 'x-demo-user: u-admin' -H 'content-type: application/json' \
            -d '{"ean":"5449000206770"}' "$BASE/api/inventory/$INV_ID/lines" > /tmp/inventory-line.json
          node - <<'NODE'
          const j=require('/tmp/inventory-line.json');
          if(j.product_number!=='HS-004873') throw new Error(`Unexpected stock product: ${JSON.stringify(j)}`);
          if(!Number.isFinite(Number(j.theoretical_qty))) throw new Error(`Dynamics stock snapshot unavailable: ${JSON.stringify(j)}`);
          console.log('Val Fleuri stock snapshot: OK');
          NODE

      - name: Validate price and promotion entities through commercial sync
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          BASE="https://deploy-preview-${PR_NUMBER}--franprix-storeops.netlify.app"
          curl -fsS -H 'x-demo-user: u-admin' "$BASE/api/stores/val-fleuri/commercial" > /tmp/commercial.json
          node - <<'NODE'
          const j=require('/tmp/commercial.json');
          if(!j.sync?.ok) throw new Error(`D365 price/promotion sync failed: ${JSON.stringify(j.sync)}`);
          console.log(`D365 price/promotion entity sync: OK (${j.items?.length||0} StoreOps controls)`);
          NODE
