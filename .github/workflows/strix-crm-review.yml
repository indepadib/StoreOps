name: Strix CRM security review (manual)
on:
  workflow_dispatch:
    inputs:
      approved:
        description: "I authorize source analysis by the configured LLM provider, with synthetic data only and a USD 5 scan cap."
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: strix-crm-manual
  cancel-in-progress: false
jobs:
  scan:
    if: github.event.inputs.approved == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: strix-security-review
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Strix CLI
        run: python -m pip install 'strix-agent==1.5.2'
      - name: Prepare isolated source-only scope
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/strix-crm/backend/services" "$RUNNER_TEMP/strix-crm/frontend/crm"
          cp backend/server.mjs "$RUNNER_TEMP/strix-crm/backend/"
          find backend/services -maxdepth 1 -type f -name 'one-crm-*.mjs' -exec cp {} "$RUNNER_TEMP/strix-crm/backend/services/" \;
          cp backend/services/dynamics-crm-customer-master.mjs "$RUNNER_TEMP/strix-crm/backend/services/"
          find frontend/crm -maxdepth 1 -type f -name '*.mjs' -exec cp {} "$RUNNER_TEMP/strix-crm/frontend/crm/" \;
      - name: Run isolated Strix source review
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.STRIX_LLM_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$STRIX_LLM" || -z "$LLM_API_KEY" ]]; then
            echo "::error::Configure dedicated STRIX_LLM and STRIX_LLM_API_KEY in the security-review environment."
            exit 1
          fi
          docker info >/dev/null
          cd "$RUNNER_TEMP"
          strix -n -t ./strix-crm --scan-mode quick --max-budget 5
      - name: Retain report for authorized repository maintainers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-crm-review
          path: ${{ runner.temp }}/strix_runs/
          retention-days: 1
          if-no-files-found: ignore
