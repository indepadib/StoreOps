name: V1.77 Apply Foundation

on:
  push:
    branches: [storeops-v1.77-finalization-foundation]
    paths: ['.github/workflows/v177-apply-foundation.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: storeops-v1.77-finalization-foundation
      - name: Apply validated foundation patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/v177.patch
          git apply /tmp/v177.patch
          rm -f .netlify-deploy-trigger .github/workflows/package-main-source.yml .github/workflows/v177-apply-foundation.yml
          node --check backend/server.mjs
          node --check backend/services/loss-api.mjs
          node backend/tests/promotion-query-filter.mjs
          node backend/tests/repair-gateway.mjs
          node backend/tests/canonical-api-routing.mjs
          git config user.name 'storeops-ci'
          git config user.email 'storeops-ci@users.noreply.github.com'
          git add -A
          git commit -m 'V1.77: unify store-aware inventory, pricing and API routing'
          git push origin HEAD:storeops-v1.77-finalization-foundation
