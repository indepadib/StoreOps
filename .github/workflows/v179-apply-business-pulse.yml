name: V1.79 Apply Business Pulse
on:
  push:
    branches: [storeops-v1.79-manager-experience]
    paths: ['.github/workflows/v179-apply-business-pulse.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: storeops-v1.79-manager-experience}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Wire Business Pulse API and manager UI
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('backend/server.mjs');s=p.read_text()
          imp="import { handleBusinessPulseApi } from './services/business-pulse-api.mjs';"
          if imp not in s:s=s.replace("import { handleWorkforceApi } from './services/workforce-api.mjs';", "import { handleWorkforceApi } from './services/workforce-api.mjs';\n"+imp)
          hook="const businessPulseResponse=await handleBusinessPulseApi({req,url,user});if(businessPulseResponse)return json(req,res,businessPulseResponse.status,businessPulseResponse.data);"
          if hook not in s:s=s.replace("const workforceResponse=await handleWorkforceApi({req,url,user});if(workforceResponse)return json(req,res,workforceResponse.status,workforceResponse.data);", "const workforceResponse=await handleWorkforceApi({req,url,user});if(workforceResponse)return json(req,res,workforceResponse.status,workforceResponse.data);\n  "+hook)
          p.write_text(s)

          p=Path('netlify/functions/api.mts');s=p.read_text()
          sales="    'STOREOPS_BUSINESS_PULSE_CACHE_SECONDS','D365_SALES_READ_MODE','D365_SALES_ENTITY','D365_STORE_RETAIL_IDS','D365_SALES_STORE_FIELD','D365_SALES_DATE_FIELD','D365_SALES_DATE_FILTER_MODE','D365_SALES_TRANSACTION_FIELD','D365_SALES_NET_FIELD','D365_SALES_QTY_FIELD','D365_SALES_PRODUCT_FIELD','D365_SALES_PRODUCT_NAME_FIELD','D365_SALES_COST_FIELD','D365_SALES_TIME_FIELD','D365_SALES_DEPARTMENT_FIELD','D365_SALES_CATEGORY_FIELD','D365_SALES_SIGN','D365_SALES_COST_SIGN','D365_SALES_PAGE_SIZE','D365_SALES_MAX_ROWS',\n"
          marker="    'D365_ODATA_PAGE_SIZE','D365_ODATA_MAX_ROWS','CLOSING_VARIANCE_TOLERANCE_DH'"
          if "'D365_SALES_READ_MODE'" not in s:s=s.replace(marker,sales+marker)
          p.write_text(s)

          p=Path('frontend/index.html');s=p.read_text()
          if '/manager-pulse.css' not in s:s=s.replace('<link rel="stylesheet" href="/manager-team.css">','<link rel="stylesheet" href="/manager-team.css"><link rel="stylesheet" href="/manager-pulse.css">')
          section='<section class="page" id="managerPerformancePage"><div id="managerPerformanceContent"></div></section>'
          if 'id="managerPerformancePage"' not in s:s=s.replace('<section class="page" id="managerJourneyPage">',section+'\n<section class="page" id="managerJourneyPage">')
          p.write_text(s)

          p=Path('frontend/js/app.js');s=p.read_text()
          imp="import { renderManagerPerformance } from './pages/manager-performance.js';"
          if imp not in s:s=s.replace("import { renderManagerTeam } from './pages/manager-team.js';", "import { renderManagerTeam } from './pages/manager-team.js';\n"+imp)
          old="function managerTabFor(page){if(page==='today')return'today';if(page==='managerScan')return'managerScan';if(page==='managerTeam'||page==='staffing')return'managerTeam';return'managerMore'}"
          new="function managerTabFor(page){if(page==='today'||page==='managerPerformance')return'today';if(page==='managerScan')return'managerScan';if(page==='managerTeam'||page==='staffing')return'managerTeam';return'managerMore'}"
          s=s.replace(old,new)
          if "if(page==='managerPerformance')return renderManagerPerformance();" not in s:s=s.replace("if(page==='managerTeam')return renderManagerTeam();", "if(page==='managerTeam')return renderManagerTeam();if(page==='managerPerformance')return renderManagerPerformance();")
          p.write_text(s)

          p=Path('.github/workflows/v179-core-verify.yml');s=p.read_text()
          for path in [
            'backend/services/dynamics-sales.mjs','backend/services/business-pulse.mjs','backend/services/business-pulse-api.mjs','backend/tests/business-pulse.mjs','backend/tests/business-pulse-api.mjs','frontend/js/pages/manager-home.js','frontend/js/pages/manager-performance.js','frontend/manager-pulse.css'
          ]:
            line=f"      - '{path}'\n"
            if line not in s:s=s.replace("      - 'docs/SAAS-RETAIL-OS.md'\n",line+"      - 'docs/SAAS-RETAIL-OS.md'\n")
          checks=[
            '          node --check backend/services/dynamics-sales.mjs\n','          node --check backend/services/business-pulse.mjs\n','          node --check backend/services/business-pulse-api.mjs\n','          node --check frontend/js/pages/manager-home.js\n','          node --check frontend/js/pages/manager-performance.js\n','          node backend/tests/business-pulse.mjs\n'
          ]
          anchor='          node backend/tests/replenishment-engine.mjs\n'
          for line in checks:
            if line not in s:s=s.replace(anchor,anchor+line);anchor=line
          api_line='          STOREOPS_TEST_BASE=http://127.0.0.1:8787 node backend/tests/business-pulse-api.mjs\n'
          if api_line not in s:s=s.replace('          STOREOPS_TEST_BASE=http://127.0.0.1:8787 node backend/tests/merchandising-api.mjs\n','          STOREOPS_TEST_BASE=http://127.0.0.1:8787 node backend/tests/merchandising-api.mjs\n'+api_line)
          p.write_text(s)
          PY
          node --check backend/server.mjs
          node --check backend/services/dynamics-sales.mjs
          node --check backend/services/business-pulse.mjs
          node --check backend/services/business-pulse-api.mjs
          node --check frontend/js/app.js
          node --check frontend/js/pages/manager-home.js
          node --check frontend/js/pages/manager-performance.js
          node backend/tests/business-pulse.mjs
          grep -q 'managerPerformancePage' frontend/index.html
          grep -q 'D365_SALES_READ_MODE' netlify/functions/api.mts
      - name: Commit Business Pulse wiring
        run: |
          git config user.name 'indepadib'
          git config user.email '55211714+indepadib@users.noreply.github.com'
          git add backend/server.mjs netlify/functions/api.mts frontend/index.html frontend/js/app.js .github/workflows/v179-core-verify.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(v1.79): wire Business Pulse and manager performance'
          git push origin HEAD:storeops-v1.79-manager-experience
