name: StoreOps V1.59 Replenishment Contract

on:
  pull_request:
    branches:
      - main

jobs:
  replenishment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replenishment and Dynamics assistant contract
        run: node backend/tests/manager-replenishment-assistant.mjs
