name: V1.78 Apply Receiving Read

on:
  push:
    branches: [storeops-v1.78-d365-receiving-read]
    paths: ['.github/workflows/v178-apply-receiving.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: storeops-v1.78-d365-receiving-read
      - name: Wire receiving adapter into StoreOps
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def repl(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'anchor missing in {path}: {old[:80]!r}')
              p.write_text(s.replace(old,new,1))

          # Domain read switch + configurable standard PO mappings.
          repl('backend/config.mjs',
          "      promotion: readMode(process.env.D365_PROMOTION_READ_MODE,'simulated')\n    },",
          "      promotion: readMode(process.env.D365_PROMOTION_READ_MODE,'simulated'),\n      receiving: readMode(process.env.D365_RECEIVING_READ_MODE,'simulated')\n    },")
          repl('backend/config.mjs',
          "      maxRows: Math.max(500,Math.min(100000,Number(process.env.D365_STOCK_MAX_ROWS)||Number(process.env.D365_ODATA_MAX_ROWS)||25000))\n    }\n  }\n};",
          "      maxRows: Math.max(500,Math.min(100000,Number(process.env.D365_STOCK_MAX_ROWS)||Number(process.env.D365_ODATA_MAX_ROWS)||25000))\n    },\n    receiving: {\n      headerEntity: process.env.D365_PO_HEADER_ENTITY || 'PurchaseOrderHeadersV2',\n      lineEntity: process.env.D365_PO_LINE_ENTITY || 'PurchaseOrderLinesV2',\n      purchaseOrderField: process.env.D365_PO_NUMBER_FIELD || 'PurchaseOrderNumber',\n      vendorField: process.env.D365_PO_VENDOR_FIELD || 'OrderVendorAccountNumber',\n      headerDateField: process.env.D365_PO_HEADER_DATE_FIELD || 'RequestedDeliveryDate',\n      headerStatusField: process.env.D365_PO_STATUS_FIELD || 'PurchaseOrderStatus',\n      headerWarehouseField: process.env.D365_PO_HEADER_WAREHOUSE_FIELD || 'DefaultReceivingWarehouseId',\n      lineNumberField: process.env.D365_PO_LINE_NUMBER_FIELD || 'LineNumber',\n      productField: process.env.D365_PO_PRODUCT_FIELD || 'ItemNumber',\n      descriptionField: process.env.D365_PO_DESCRIPTION_FIELD || 'LineDescription',\n      barcodeField: process.env.D365_PO_BARCODE_FIELD || 'Barcode',\n      categoryField: process.env.D365_PO_CATEGORY_FIELD || 'ProcurementProductCategoryName',\n      orderedQtyField: process.env.D365_PO_ORDERED_QTY_FIELD || 'OrderedPurchaseQuantity',\n      receivedQtyField: process.env.D365_PO_RECEIVED_QTY_FIELD || 'ReceivedPurchaseQuantity',\n      remainingQtyField: process.env.D365_PO_REMAINING_QTY_FIELD || 'RemainingPurchaseQuantity',\n      unitField: process.env.D365_PO_UNIT_FIELD || 'PurchaseUnitSymbol',\n      lineDateField: process.env.D365_PO_LINE_DATE_FIELD || 'RequestedDeliveryDate',\n      warehouseField: process.env.D365_PO_WAREHOUSE_FIELD || 'ReceivingWarehouseId',\n      pageSize: Math.max(50,Math.min(1000,Number(process.env.D365_PO_PAGE_SIZE)||250)),\n      maxRows: Math.max(500,Math.min(25000,Number(process.env.D365_PO_MAX_ROWS)||10000))\n    }\n  }\n};")
          repl('backend/config.mjs',
          "    if(config.dynamics.read.stock==='live'&&!config.dynamics.stock.entity)issues.push('D365_STOCK_ENTITY manquant pour Stock LIVE');",
          "    if(config.dynamics.read.stock==='live'&&!config.dynamics.stock.entity)issues.push('D365_STOCK_ENTITY manquant pour Stock LIVE');\n    if(config.dynamics.read.receiving==='live'&&(!config.dynamics.receiving.headerEntity||!config.dynamics.receiving.lineEntity))issues.push('Entités Purchase Order manquantes pour Réception/PO LIVE');")

          # Diagnostics expose PO mapping/read mode.
          repl('backend/services/dynamics.mjs',
          "      mixMatchLineGroupEntity:c.entities?.mixMatchLineGroup||null,\n      dataAreaField:c.dataAreaField,",
          "      mixMatchLineGroupEntity:c.entities?.mixMatchLineGroup||null,\n      purchaseOrderHeaderEntity:c.receiving?.headerEntity||null,\n      purchaseOrderLineEntity:c.receiving?.lineEntity||null,\n      dataAreaField:c.dataAreaField,")
          repl('backend/services/dynamics.mjs',
          "configuredEntities:{productEntity:config.dynamics.productEntity||null,barcodeEntity:config.dynamics.barcodeEntity||null,stockEntity:config.dynamics.stock?.entity||null}",
          "configuredEntities:{productEntity:config.dynamics.productEntity||null,barcodeEntity:config.dynamics.barcodeEntity||null,stockEntity:config.dynamics.stock?.entity||null,purchaseOrderHeaderEntity:config.dynamics.receiving?.headerEntity||null,purchaseOrderLineEntity:config.dynamics.receiving?.lineEntity||null}")

          # API: GET transparently syncs D365 expected POs; explicit sync/config routes for diagnostics.
          repl('backend/services/loss-api.mjs',
          "import { staffingConfig,staffingDay,staffingSummary,syncStaffingDay,setAttendance,updateStaffingPolicy } from './staffing.mjs';",
          "import { staffingConfig,staffingDay,staffingSummary,syncStaffingDay,setAttendance,updateStaffingPolicy } from './staffing.mjs';\nimport { receivingIntegrationConfig,syncExpectedReceiptsFromDynamics,listReceiptsForStore } from './dynamics-receiving.mjs';")
          repl('backend/services/loss-api.mjs',
          " if(path==='/api/dynamics/stock/config'&&req.method==='GET'){requireDirector(user);return{status:200,data:stockIntegrationConfig()}}",
          " if(path==='/api/dynamics/stock/config'&&req.method==='GET'){requireDirector(user);return{status:200,data:stockIntegrationConfig()}}\n if(path==='/api/dynamics/receiving/config'&&req.method==='GET'){requireDirector(user);return{status:200,data:receivingIntegrationConfig()}}\n p=route(path,'/api/stores/:storeId/receipts');if(p&&req.method==='GET'){requireStore(user,p.storeId);const businessDate=url.searchParams.get('date')||todayISO();let sync;try{sync=await syncExpectedReceiptsFromDynamics(p.storeId,{businessDate})}catch(error){sync={synced:false,mode:'ERROR',error:error?.message||String(error),code:error?.code||'D365_RECEIVING_SYNC_FAILED'}}const integration={mode:sync.mode||'SIMULATED',synced:!!sync.synced,warehouseId:sync.warehouseId||null,error:sync.error||null,code:sync.code||null};return{status:200,data:listReceiptsForStore(p.storeId).map(r=>({...r,integration}))}}\n p=route(path,'/api/stores/:storeId/receipts/sync');if(p&&req.method==='POST'){requireStore(user,p.storeId);requireManage(user,p.storeId);const businessDate=url.searchParams.get('date')||todayISO(),sync=await syncExpectedReceiptsFromDynamics(p.storeId,{businessDate});return{status:200,data:{sync,items:listReceiptsForStore(p.storeId)}}}")

          # Netlify passes receiving env vars to the canonical backend.
          repl('netlify/functions/api.mts',
          "    'D365_MODE','D365_PRODUCT_READ_MODE','D365_STOCK_READ_MODE','D365_PRICE_READ_MODE','D365_PROMOTION_READ_MODE',",
          "    'D365_MODE','D365_PRODUCT_READ_MODE','D365_STOCK_READ_MODE','D365_PRICE_READ_MODE','D365_PROMOTION_READ_MODE','D365_RECEIVING_READ_MODE',")
          repl('netlify/functions/api.mts',
          "    'D365_STOCK_MAX_OUT_OF_STOCK','D365_STOCK_PAGE_SIZE','D365_STOCK_MAX_ROWS','D365_ODATA_PAGE_SIZE','D365_ODATA_MAX_ROWS','CLOSING_VARIANCE_TOLERANCE_DH'",
          "    'D365_STOCK_MAX_OUT_OF_STOCK','D365_STOCK_PAGE_SIZE','D365_STOCK_MAX_ROWS',\n    'D365_PO_HEADER_ENTITY','D365_PO_LINE_ENTITY','D365_PO_NUMBER_FIELD','D365_PO_VENDOR_FIELD','D365_PO_HEADER_DATE_FIELD','D365_PO_STATUS_FIELD','D365_PO_HEADER_WAREHOUSE_FIELD',\n    'D365_PO_LINE_NUMBER_FIELD','D365_PO_PRODUCT_FIELD','D365_PO_DESCRIPTION_FIELD','D365_PO_BARCODE_FIELD','D365_PO_CATEGORY_FIELD','D365_PO_ORDERED_QTY_FIELD','D365_PO_RECEIVED_QTY_FIELD','D365_PO_REMAINING_QTY_FIELD','D365_PO_UNIT_FIELD','D365_PO_LINE_DATE_FIELD','D365_PO_WAREHOUSE_FIELD','D365_PO_PAGE_SIZE','D365_PO_MAX_ROWS',\n    'D365_ODATA_PAGE_SIZE','D365_ODATA_MAX_ROWS','CLOSING_VARIANCE_TOLERANCE_DH'")

          # System readiness reflects receiving as an independent READ domain.
          repl('frontend/js/integration-readiness.js',
          "  const promoReady=Boolean(mappings.retailDiscountEntity&&mappings.retailDiscountLineEntity);",
          "  const promoReady=Boolean(mappings.retailDiscountEntity&&mappings.retailDiscountLineEntity);\n  const receivingReady=Boolean(mappings.purchaseOrderHeaderEntity&&mappings.purchaseOrderLineEntity);")
          repl('frontend/js/integration-readiness.js',
          "    {key:'receiving',domain:'Réception / PO',storeops:storeops('StoreOps'),read:mapped('À mapper / auditer'),write:mapped('À mapper'),pilot:'Contrôle réception StoreOps utilisable ; aucun posting D365.'},",
          "    {key:'receiving',domain:'Réception / PO',storeops:storeops('StoreOps'),read:receivingReady?read('receiving',true):mapped('À mapper / auditer'),write:mapped('À mapper'),pilot:'READ commandes attendues par warehouse ; contrôles StoreOps ; posting D365 toujours bloqué.'},")

          # Receiving UI identifies Dynamics source and never offers a fake live posting button.
          repl('frontend/js/pages/receipts.js',
          "function receipt(r,ro){const controlled=(r.lines||[]).filter(l=>l.quality_control_id).length;return `<div class=\"card\"><div class=\"row\"><div><strong>${esc(r.po_number)} · ${esc(r.vendor)}</strong><div class=\"small muted\">Prévue ${esc(r.eta)} · ${r.lines.length} ligne(s) · ${controlled}/${r.lines.length} contrôlée(s)</div></div>${status(r.status==='POSTED'?'Réceptionnée':controlled===r.lines.length?'Prête à réceptionner':'À contrôler',r.status==='POSTED'?'ok':controlled===r.lines.length?'ok':'warn')}</div><div class=\"stack\" style=\"margin-top:12px\">${r.lines.map(l=>line(r,l,ro)).join('')}</div>${!ro&&r.status!=='POSTED'?`<button class=\"btn brand wide\" data-post-receipt=\"${esc(r.po_number)}\" style=\"margin-top:12px\" ${controlled!==r.lines.length?'disabled':''}>${controlled===r.lines.length?'Confirmer la réception système':'Contrôler toutes les lignes avant réception'}</button>`:''}</div>`}",
          "function receipt(r,ro){const controlled=(r.lines||[]).filter(l=>l.quality_control_id).length,d365=r.source==='D365';return `<div class=\"card\"><div class=\"row\"><div><strong>${esc(r.po_number)} · ${esc(r.vendor)}</strong><div class=\"small muted\">Prévue ${esc(r.eta)} · ${r.lines.length} ligne(s) · ${controlled}/${r.lines.length} contrôlée(s)${d365?' · D365':''}</div></div>${status(r.status==='POSTED'?'Réceptionnée':controlled===r.lines.length?'Prête à réceptionner':'À contrôler',r.status==='POSTED'?'ok':controlled===r.lines.length?'ok':'warn')}</div><div class=\"stack\" style=\"margin-top:12px\">${r.lines.map(l=>line(r,l,ro)).join('')}</div>${!ro&&r.status!=='POSTED'?(d365?`<div class=\"banner ban-info\" style=\"margin-top:12px\"><strong>Contrôles StoreOps disponibles</strong><div class=\"small\" style=\"margin-top:4px\">Le posting de réception dans Dynamics reste volontairement désactivé jusqu'à validation du mapping F&O.</div></div>`:`<button class=\"btn brand wide\" data-post-receipt=\"${esc(r.po_number)}\" style=\"margin-top:12px\" ${controlled!==r.lines.length?'disabled':''}>${controlled===r.lines.length?'Confirmer la réception système':'Contrôler toutes les lignes avant réception'}</button>`):''}</div>`}")
          repl('frontend/js/pages/receipts.js',
          "<div class=\"small muted\">${esc(l.ean)} · ${esc(cat)} · commandé ${l.ordered_qty}</div>",
          "<div class=\"small muted\">${esc(l.ean&&l.ean!==l.product_number?`EAN ${l.ean}`:`SKU ${l.product_number||l.ean}`)} · ${esc(cat)} · commandé ${l.ordered_qty}${l.remaining_qty!=null?` · reste ${l.remaining_qty}`:''}</div>")

          # Environment template: only confirmed Val Fleuri warehouse remains as example mapping.
          repl('.env.example',
          "D365_PROMOTION_READ_MODE=simulated\nD365_BASE_URL=",
          "D365_PROMOTION_READ_MODE=simulated\nD365_RECEIVING_READ_MODE=simulated\nD365_BASE_URL=")
          repl('.env.example',
          "D365_STORE_WAREHOUSES=val-fleuri=FRP0001,trefle=FRP0002",
          "D365_STORE_WAREHOUSES=val-fleuri=FRP0001")
          repl('.env.example',
          "D365_STOCK_MAX_ROWS=25000\n\nD365_ODATA_PAGE_SIZE=500",
          "D365_STOCK_MAX_ROWS=25000\n\n# Réception / Purchase Orders READ. Écritures réception toujours bloquées.\nD365_PO_HEADER_ENTITY=PurchaseOrderHeadersV2\nD365_PO_LINE_ENTITY=PurchaseOrderLinesV2\nD365_PO_NUMBER_FIELD=PurchaseOrderNumber\nD365_PO_VENDOR_FIELD=OrderVendorAccountNumber\nD365_PO_HEADER_DATE_FIELD=RequestedDeliveryDate\nD365_PO_STATUS_FIELD=PurchaseOrderStatus\nD365_PO_HEADER_WAREHOUSE_FIELD=DefaultReceivingWarehouseId\nD365_PO_LINE_NUMBER_FIELD=LineNumber\nD365_PO_PRODUCT_FIELD=ItemNumber\nD365_PO_DESCRIPTION_FIELD=LineDescription\nD365_PO_BARCODE_FIELD=Barcode\nD365_PO_CATEGORY_FIELD=ProcurementProductCategoryName\nD365_PO_ORDERED_QTY_FIELD=OrderedPurchaseQuantity\nD365_PO_RECEIVED_QTY_FIELD=ReceivedPurchaseQuantity\nD365_PO_REMAINING_QTY_FIELD=RemainingPurchaseQuantity\nD365_PO_UNIT_FIELD=PurchaseUnitSymbol\nD365_PO_LINE_DATE_FIELD=RequestedDeliveryDate\nD365_PO_WAREHOUSE_FIELD=ReceivingWarehouseId\nD365_PO_PAGE_SIZE=250\nD365_PO_MAX_ROWS=10000\n\nD365_ODATA_PAGE_SIZE=500")
          PY

          node --check backend/config.mjs
          node --check backend/services/dynamics.mjs
          node --check backend/services/loss-api.mjs
          node --check backend/services/dynamics-receiving.mjs
          node --check frontend/js/integration-readiness.js
          node --check frontend/js/pages/receipts.js
          node backend/tests/dynamics-receiving.mjs

          git config user.name 'storeops-ci'
          git config user.email 'storeops-ci@users.noreply.github.com'
          git add -A ':!.github/workflows/v178-apply-receiving.yml'
          git commit -m 'V1.78: integrate D365 purchase orders in receiving read flow'
          git push origin HEAD:storeops-v1.78-d365-receiving-read
