name: V1.89 D365 Secret Refresh Contract

on:
  push:
    branches: [storeops-v1.89-d365-secret-refresh]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check backend/config.mjs
      - name: Dynamic secret rotation contract
        run: node backend/tests/v189-d365-secret-refresh.mjs
      - name: Existing Dynamics diagnostics contract
        run: |
          node --check backend/services/dynamics.mjs
          grep -q "client_secret:config.dynamics.clientSecret" backend/services/dynamics.mjs
      - name: Security guard
        run: |
          ! grep -R --line-number --exclude-dir=tests "D365_CLIENT_SECRET=['\"]" backend frontend netlify
