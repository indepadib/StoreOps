name: D365 Promotion Live Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  promo-smoke:
    if: github.head_ref == 'storeops-v1.75-promo-live-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Netlify Deploy Preview
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          BASE="https://deploy-preview-${PR_NUMBER}--franprix-storeops.netlify.app"
          echo "Waiting for $BASE"
          ready=0
          for i in $(seq 1 48); do
            code=$(curl -sS -o /tmp/probe.json -w '%{http_code}' --max-time 20 "$BASE/smoke/d365-promo?mode=structure" || true)
            if [ "$code" = "200" ] && grep -q '"groupEntity"' /tmp/probe.json 2>/dev/null; then ready=1; break; fi
            sleep 5
          done
          if [ "$ready" != "1" ]; then cat /tmp/probe.json 2>/dev/null || true; exit 1; fi

      - name: Probe filterable promotion structure
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          BASE="https://deploy-preview-${PR_NUMBER}--franprix-storeops.netlify.app"
          echo '===== PROMOTION STRUCTURE ====='
          curl -sS --max-time 45 "$BASE/smoke/d365-promo?mode=structure" | tee /tmp/structure.json
          echo

      - name: Smoke known EANs
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          BASE="https://deploy-preview-${PR_NUMBER}--franprix-storeops.netlify.app"
          for ean in 5449000206770 6111069004350; do
            echo "===== EAN $ean ====="
            curl -sS --max-time 45 "$BASE/smoke/d365-promo?ean=$ean" | tee "/tmp/$ean.json"
            echo
          done

      - name: Summarize promotion diagnostics
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const file of ['structure','5449000206770','6111069004350']){
            let x;try{x=JSON.parse(fs.readFileSync(`/tmp/${file}.json`,'utf8'))}catch(e){console.log(file,'INVALID_JSON',e.message);continue}
            console.log(`===== ${file} =====`);
            console.log(JSON.stringify(x,null,2));
          }
          NODE
