name: D365 Promotion Live Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  promo-smoke:
    if: github.head_ref == 'storeops-v1.75-promo-live-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for lightweight offer stats
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          BASE="https://deploy-preview-${PR_NUMBER}--franprix-storeops.netlify.app"
          ready=0
          for i in $(seq 1 60); do
            code=$(curl -sS -o /tmp/stats.json -w '%{http_code}' --max-time 30 "$BASE/smoke/d365-promo?mode=offer-stats" || true)
            if [ "$code" = "200" ] && grep -q '"activeCount"' /tmp/stats.json 2>/dev/null; then ready=1; break; fi
            sleep 5
          done
          if [ "$ready" != "1" ]; then cat /tmp/stats.json 2>/dev/null || true; exit 1; fi
          cat /tmp/stats.json

      - name: Validate offer-driven known EANs
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          BASE="https://deploy-preview-${PR_NUMBER}--franprix-storeops.netlify.app"
          for ean in 5449000206770 6111069004350; do
            code=$(curl -sS -o "/tmp/offer-$ean.json" -w '%{http_code}' --max-time 90 "$BASE/smoke/d365-promo?mode=offer-driven&ean=$ean" || true)
            echo "===== $ean HTTP $code ====="
            cat "/tmp/offer-$ean.json"
            echo
            [ "$code" = "200" ]
            grep -q '"diagnostic"' "/tmp/offer-$ean.json"
          done

      - name: Summarize diagnostics
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('/tmp/stats.json','utf8'));
          console.log('STATS',JSON.stringify(s.diagnostic||s,null,2));
          for(const ean of ['5449000206770','6111069004350']){
            const x=JSON.parse(fs.readFileSync(`/tmp/offer-${ean}.json`,'utf8'));
            const d=x.diagnostic||{};
            console.log(JSON.stringify({ean,ok:x.ok,product:x.product,groups:d.groups,headers:d.headers,lines:d.lines,matches:d.matches},null,2));
          }
          NODE
