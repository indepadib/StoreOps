name: D365 Promotion Live Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  promo-smoke:
    if: github.head_ref == 'storeops-v1.75-promo-live-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for offer-driven preview endpoint
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          BASE="https://deploy-preview-${PR_NUMBER}--franprix-storeops.netlify.app"
          ready=0
          for i in $(seq 1 60); do
            code=$(curl -sS -o /tmp/offer-5449000206770.json -w '%{http_code}' --max-time 90 "$BASE/smoke/d365-promo?mode=offer-driven&ean=5449000206770" || true)
            if [ "$code" = "200" ] && grep -q '"diagnostic"' /tmp/offer-5449000206770.json 2>/dev/null; then ready=1; break; fi
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo "Offer-driven endpoint did not return diagnostic JSON"
            cat /tmp/offer-5449000206770.json 2>/dev/null || true
            exit 1
          fi

      - name: Validate second known EAN
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          BASE="https://deploy-preview-${PR_NUMBER}--franprix-storeops.netlify.app"
          curl -sS --max-time 90 "$BASE/smoke/d365-promo?mode=offer-driven&ean=6111069004350" | tee /tmp/offer-6111069004350.json
          grep -q '"diagnostic"' /tmp/offer-6111069004350.json

      - name: Summarize offer-driven diagnostics
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const ean of ['5449000206770','6111069004350']){
            const x=JSON.parse(fs.readFileSync(`/tmp/offer-${ean}.json`,'utf8'));
            const d=x.diagnostic||{};
            console.log(JSON.stringify({ean,ok:x.ok,product:x.product,groups:d.groups,headers:d.headers,lines:d.lines,matches:d.matches},null,2));
          }
          NODE
