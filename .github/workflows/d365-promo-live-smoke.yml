name: D365 Promotion Live Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  promo-smoke:
    if: github.head_ref == 'storeops-v1.75-promo-live-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Netlify Deploy Preview
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          BASE="https://deploy-preview-${PR_NUMBER}--franprix-storeops.netlify.app"
          ready=0
          for i in $(seq 1 48); do
            code=$(curl -sS -o /tmp/probe.json -w '%{http_code}' --max-time 20 "$BASE/smoke/d365-promo?mode=structure" || true)
            if [ "$code" = "200" ] && grep -q '"groupEntity"' /tmp/probe.json 2>/dev/null; then ready=1; break; fi
            sleep 5
          done
          if [ "$ready" != "1" ]; then cat /tmp/probe.json 2>/dev/null || true; exit 1; fi

      - name: Validate offer-driven lookup
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          BASE="https://deploy-preview-${PR_NUMBER}--franprix-storeops.netlify.app"
          for ean in 5449000206770 6111069004350; do
            echo "===== OFFER-DRIVEN $ean ====="
            curl -sS --max-time 90 "$BASE/smoke/d365-promo?mode=offer-driven&ean=$ean" | tee "/tmp/offer-$ean.json"
            echo
          done

      - name: Summarize offer-driven diagnostics
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const ean of ['5449000206770','6111069004350']){
            let x;try{x=JSON.parse(fs.readFileSync(`/tmp/offer-${ean}.json`,'utf8'))}catch(e){console.log(ean,'INVALID_JSON',e.message);continue}
            const d=x.diagnostic||{};
            console.log(JSON.stringify({ean,ok:x.ok,product:x.product,groups:d.groups,headers:d.headers,lines:d.lines,matches:d.matches},null,2));
          }
          NODE
