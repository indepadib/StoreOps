name: V2.30.3 Netlify Operational Preview

on:
  pull_request:
    branches: [main]

jobs:
  preview-e2e:
    if: github.head_ref == 'storeops-v2.30.3-operational-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for exact V2.30.3 preview
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--franprix-storeops.netlify.app
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 90); do
            health=$(curl -fsS "$PREVIEW_URL/api/health" || true)
            index=$(curl -fsS "$PREVIEW_URL/index.html?ci=2303" || true)
            app=$(curl -fsS "$PREVIEW_URL/js/app.js?ci=2303" || true)
            if echo "$health" | grep -q '"version":"2.30.3"'               && echo "$index" | grep -q 'v2.30.3'               && echo "$index" | grep -q 'auth-entry.js?v=2303'               && echo "$app" | grep -q "RELEASE_BUILD='2303'"               && echo "$app" | grep -Fq '$('\''#nav button[data-page],#managerNav button[data-page],#qualityAuditNav button[data-page],#developmentNavBar button[data-page]'\'').forEach'; then
              ready=1
              echo "$health"
              break
            fi
            echo "Waiting exact preview V2.30.3 ($i/90)"
            sleep 5
          done
          test "$ready" = "1"

      - name: Session and stores
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--franprix-storeops.netlify.app
        run: |
          set -euo pipefail
          session_code=$(curl -sS -H 'x-demo-user: u-vf' "$PREVIEW_URL/api/session" -o /tmp/session.json -w '%{http_code}' || true)
          stores_code=$(curl -sS -H 'x-demo-user: u-ops' "$PREVIEW_URL/api/stores" -o /tmp/stores.json -w '%{http_code}' || true)
          echo "SESSION HTTP $session_code"; cat /tmp/session.json
          echo "STORES HTTP $stores_code"; cat /tmp/stores.json
          test "$session_code" = "200"
          test "$stores_code" = "200"
          node -e "const s=require('/tmp/session.json'),x=require('/tmp/stores.json');if(!s.user||!x.some(v=>v.id==='val-fleuri')||!x.some(v=>v.id==='trefle'))process.exit(1)"

      - name: Cash opening stable route
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--franprix-storeops.netlify.app
        run: |
          set -euo pipefail
          curl -fsS -H 'x-demo-user: u-tr' -H 'content-type: application/json' -X POST "$PREVIEW_URL/api/stores/trefle/cash-opening/sync" --data '{}' -o /tmp/cash.json
          till=$(node -e "const x=require('/tmp/cash.json');const t=x.opening?.lines?.[0]?.till_code;if(!t)process.exit(2);process.stdout.write(t)")
          expected=$(node -e "const x=require('/tmp/cash.json');process.stdout.write(String(x.opening.lines[0].expected_float??500))")
          curl -sS -H 'x-demo-user: u-tr' -H 'content-type: application/json' -X POST "$PREVIEW_URL/api/stores/trefle/cash-opening/check"             --data "{"tillCode":"$till","cashierName":"Preview V2303","declaredFloat":$expected,"posOk":true,"tpeOk":true,"printerOk":true,"shiftOpened":true}"             -o /tmp/cash-check.json -w '%{http_code}' > /tmp/cash-code
          code=$(cat /tmp/cash-code); test "$code" = "200" || test "$code" = "409"
          node -e "const x=require('/tmp/cash-check.json');if(!x.line?.till_code)process.exit(1)"

      - name: Staffing null-safe route
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--franprix-storeops.netlify.app
        run: |
          set -euo pipefail
          curl -fsS -H 'x-demo-user: u-vf' "$PREVIEW_URL/api/stores/val-fleuri/staffing" -o /tmp/staff-get.json
          curl -fsS -H 'x-demo-user: u-vf' -H 'content-type: application/json' -X POST "$PREVIEW_URL/api/stores/val-fleuri/staffing/sync" --data '{}' -o /tmp/staff.json
          node -e "const x=require('/tmp/staff.json');if(!x.summary||typeof x.summary!=='object'||!x.day||!x.day.metrics)process.exit(1)"

      - name: Account creation and Quality network rights
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--franprix-storeops.netlify.app
        run: |
          set -euo pipefail
          email="quality.preview.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}@example.invalid"
          curl -fsS -H 'x-demo-user: u-ops' -H 'content-type: application/json' -X POST "$PREVIEW_URL/api/admin/access/accounts"             --data "{"name":"Amine Preview 2303","email":"$email","profileCode":"QUALITY_AUDIT","identityProvider":"ENTRA","note":"preview e2e"}"             -o /tmp/account.json
          qid=$(node -e "const x=require('/tmp/account.json');if(!x.id||x.profileCode!=='QUALITY_AUDIT'||x.scope!=='NETWORK')process.exit(2);process.stdout.write(x.id)")
          curl -fsS -H 'x-demo-user: u-ops' -H 'content-type: application/json' -X PUT "$PREVIEW_URL/api/admin/access/accounts/$qid"             --data "{"name":"Amine Preview 2303","email":"$email","profileCode":"QUALITY_AUDIT","identityProvider":"ENTRA","note":"édition OK"}"             -o /tmp/account-update.json
          curl -fsS -H "x-demo-user: $qid" "$PREVIEW_URL/api/stores" -o /tmp/quality-stores.json
          node -e "const x=require('/tmp/quality-stores.json');if(!x.some(v=>v.id==='val-fleuri')||!x.some(v=>v.id==='trefle'))process.exit(1)"
          for store in val-fleuri trefle; do
            curl -fsS -H "x-demo-user: $qid" -H 'content-type: application/json' -X POST "$PREVIEW_URL/api/stores/$store/dlc"               --data "{"reference":"3017620422003","expiryDate":"2026-10-15","quantity":1,"zone":"Rayon","expiryType":"DDM","unit":"pièce","comment":"Preview V2303"}"               -o "/tmp/dlc-$store.json"
            curl -fsS -H "x-demo-user: $qid" -H 'content-type: application/json' -X POST "$PREVIEW_URL/api/stores/$store/quality"               --data "{"reference":"3017620422003","context":"Contrôle réseau","deliveredQty":1,"acceptedQty":1,"rejectedQty":0,"packagingStatus":"OK","appearanceStatus":"NA","expiryDate":"2026-10-15","comment":"Preview V2303"}"               -o "/tmp/quality-$store.json"
          done

      - name: PO TO inventory routes on both pilots
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--franprix-storeops.netlify.app
        run: |
          set -euo pipefail
          for store in val-fleuri trefle; do
            curl -fsS -H 'x-demo-user: u-ops' "$PREVIEW_URL/api/stores/$store/receipts/po" -o "/tmp/po-$store.json"
            curl -fsS -H 'x-demo-user: u-ops' "$PREVIEW_URL/api/stores/$store/receipts/to" -o "/tmp/to-$store.json"
            curl -fsS -H 'x-demo-user: u-ops' "$PREVIEW_URL/api/stores/$store/inventory?status=ALL" -o "/tmp/inv-$store.json"
            node -e "for(const p of ['/tmp/po-$store.json','/tmp/to-$store.json']){const x=require(p);if(!Array.isArray(x))process.exit(1)} const i=require('/tmp/inv-$store.json');if(!i.summary||!Array.isArray(i.items))process.exit(2)"
          done
