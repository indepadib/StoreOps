name: V1.79 Core Verify
on:
  push:
    branches: [storeops-v1.79-manager-experience]
    paths:
      - 'backend/server.mjs'
      - 'netlify/functions/api.mts'
      - 'backend/services/workforce.mjs'
      - 'backend/services/workforce-api.mjs'
      - 'backend/services/replenishment-engine.mjs'
      - 'backend/services/dynamics-staffing.mjs'
      - 'backend/services/dynamics-stock.mjs'
      - 'backend/services/dynamics-sales.mjs'
      - 'backend/services/business-pulse.mjs'
      - 'backend/services/business-pulse-api.mjs'
      - 'backend/services/price-check.mjs'
      - 'backend/services/item-assistant.mjs'
      - 'backend/services/process-template-engine.mjs'
      - 'backend/services/retail-insights.mjs'
      - 'backend/services/export-template.mjs'
      - 'backend/services/assortment.mjs'
      - 'backend/services/connector-contract.mjs'
      - 'backend/services/retail-process-catalog.mjs'
      - 'backend/services/stock-signals.mjs'
      - 'backend/services/dynamics-merchandising.mjs'
      - 'backend/services/merchandising-api.mjs'
      - 'backend/tests/workforce-engine.mjs'
      - 'backend/tests/workforce-api.mjs'
      - 'backend/tests/replenishment-engine.mjs'
      - 'backend/tests/business-pulse.mjs'
      - 'backend/tests/business-pulse-api.mjs'
      - 'backend/tests/saas-retail-kernel.mjs'
      - 'backend/tests/merchandising-kernel.mjs'
      - 'backend/tests/dynamics-merchandising.mjs'
      - 'backend/tests/merchandising-api.mjs'
      - 'frontend/index.html'
      - 'frontend/js/app.js'
      - 'frontend/js/pages/manager-home.js'
      - 'frontend/js/pages/manager-scan.js'
      - 'frontend/js/pages/manager-team.js'
      - 'frontend/js/pages/manager-performance.js'
      - 'frontend/manager-scan.css'
      - 'frontend/manager-team.css'
      - 'frontend/manager-pulse.css'
      - 'docs/SAAS-RETAIL-OS.md'
      - '.github/workflows/v179-core-verify.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kernel contracts
        run: |
          node --check backend/server.mjs
          node --check backend/services/workforce.mjs
          node --check backend/services/workforce-api.mjs
          node --check backend/services/replenishment-engine.mjs
          node --check backend/services/dynamics-staffing.mjs
          node --check backend/services/dynamics-stock.mjs
          node --check backend/services/dynamics-sales.mjs
          node --check backend/services/business-pulse.mjs
          node --check backend/services/business-pulse-api.mjs
          node --check backend/services/price-check.mjs
          node --check backend/services/item-assistant.mjs
          node --check backend/services/process-template-engine.mjs
          node --check backend/services/retail-insights.mjs
          node --check backend/services/export-template.mjs
          node --check backend/services/assortment.mjs
          node --check backend/services/connector-contract.mjs
          node --check backend/services/retail-process-catalog.mjs
          node --check backend/services/stock-signals.mjs
          node --check backend/services/dynamics-merchandising.mjs
          node --check backend/services/merchandising-api.mjs
          node --check frontend/js/app.js
          node --check frontend/js/pages/manager-home.js
          node --check frontend/js/pages/manager-scan.js
          node --check frontend/js/pages/manager-team.js
          node --check frontend/js/pages/manager-performance.js
          node backend/tests/workforce-engine.mjs
          node backend/tests/replenishment-engine.mjs
          node backend/tests/business-pulse.mjs
          node backend/tests/saas-retail-kernel.mjs
          STOREOPS_DB=/tmp/storeops-merchandising-kernel.db node backend/tests/merchandising-kernel.mjs
          STOREOPS_DB=/tmp/storeops-d365-merchandising.db node backend/tests/dynamics-merchandising.mjs
          test "$(python - <<'PY'
          from pathlib import Path
          import re
          s=Path('frontend/index.html').read_text()
          m=re.search(r'<nav class="manager-nav".*?</nav>',s,re.S)
          print(len(re.findall(r'<button ',m.group(0))) if m else 0)
          PY
          )" = "4"
          grep -q 'data-page="managerScan"' frontend/index.html
          grep -q 'data-page="managerTeam"' frontend/index.html
          grep -q 'managerPerformancePage' frontend/index.html
      - name: Manager API contracts
        run: |
          PORT=8787 AUTH_MODE=demo STOREOPS_DB=/tmp/storeops-v179-api.db node backend/server.mjs >/tmp/storeops-v179.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then break; fi
            sleep 0.25
          done
          STOREOPS_TEST_BASE=http://127.0.0.1:8787 node backend/tests/merchandising-api.mjs
          STOREOPS_TEST_BASE=http://127.0.0.1:8787 node backend/tests/workforce-api.mjs
          STOREOPS_TEST_BASE=http://127.0.0.1:8787 node backend/tests/business-pulse-api.mjs
