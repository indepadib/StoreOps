name: V1.85 Access & UX Contract

on:
  push:
    branches: [storeops-v1.85-access-fast-home]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check backend/services/access-management.mjs
          node --check backend/auth/session.mjs
          node --check frontend/js/app.js
          node --check frontend/js/auth-entry.js
          node --check frontend/js/pages/today.js
          node --check frontend/js/pages/admin-studio.js
          node --check frontend/js/pages/operations-hub.js
          node --check frontend/js/pages/development.js
          node --check frontend/js/admin-studio-access.js
      - name: Access governance and Entra relinking
        run: STOREOPS_DB=/tmp/storeops-v185-access.db node backend/tests/v180-access-management.mjs
      - name: Existing development regression
        run: STOREOPS_DB=/tmp/storeops-v185-development.db node backend/tests/v180-development.mjs
      - name: UX and performance guards
        run: |
          grep -q 'data-page="operationsHub"' frontend/index.html
          grep -q 'data-page="adminStudio"' frontend/index.html
          test "$(grep -o 'data-page="' frontend/index.html | wc -l)" -lt 30
          ! grep -q 'src="/js/admin-studio-access.js"' frontend/index.html
          ! grep -q 'src="/js/admin-studio-stores.js"' frontend/index.html
          ! grep -q 'src="/js/admin-studio-replenishment.js"' frontend/index.html
          ! grep -q 'src="/js/manager-polish.js"' frontend/index.html
          grep -q "loadAdminModule" frontend/js/pages/admin-studio.js
          grep -q "Opérations magasin" frontend/js/pages/admin-studio.js
          grep -q "MISSING_IDENTITY" backend/services/access-management.mjs
          grep -q "Microsoft à lier" frontend/js/admin-studio-access.js
          grep -q "Maximum trois actions prioritaires" frontend/js/pages/today.js
          grep -q "De l’opportunité au magasin ouvert" frontend/js/pages/development.js
