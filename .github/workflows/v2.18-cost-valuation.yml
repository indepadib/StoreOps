name: V2.18 Cost & Operational Valuation

on:
  push:
    branches: [storeops-v2.18-cost-valuation]
  pull_request:
    branches: [main]

jobs:
  cost-valuation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check backend/services/d365-cost-mapping.mjs
          node --check backend/services/dynamics-cost.mjs
          node --check backend/services/unit-conversion.mjs
          node --check backend/services/loss-valuation.mjs
          node --check backend/services/excel-workbook.mjs
          node --check backend/services/operations-excel.mjs
          node --check backend/services/loss.mjs
          node --check backend/services/loss-api.mjs
          node --check backend/services/integration-registry-api.mjs
          node --check backend/services/loss-export-api.mjs
          node --check backend/server.mjs
          node --check frontend/js/admin-cost-mapping.js
          node --check frontend/js/pages/losses.js
          node --check frontend/js/pages/today.js
          node --check frontend/js/enhancements-entry.js
      - name: Cost valuation contract
        run: node backend/tests/v218-cost-valuation.mjs
      - name: Weighted loss unit valuation contract
        run: node backend/tests/v2221-loss-unit-valuation.mjs
      - name: V2.17 inventory and loss regression
        run: node backend/tests/v217-demo-ready-inventory-loss.mjs
      - name: Truthful integrations regression
        run: node backend/tests/v215-truthful-integrations.mjs
      - name: Price history regression
        run: node backend/tests/v208-price-history-mapping.mjs
      - name: Production asset coherence
        run: node backend/tests/v200-production-assets.mjs
      - name: Safety guards
        run: |
          grep -q "D365_COST_MAPPING_NOT_VALIDATED" backend/services/d365-cost-mapping.mjs
          grep -q "COST_MAPPING_UNMAPPED" backend/services/dynamics-cost.mjs
          grep -q "unit_cost_value" backend/services/loss.mjs
          grep -q "LOSS_VALUATION_VERSION" backend/services/loss.mjs
          grep -q "Quantité démarquée" backend/services/operations-excel.mjs
          grep -q "6 000 g" frontend/js/pages/losses.js
          grep -q "Activer coût LIVE" frontend/js/admin-cost-mapping.js
          grep -q "Exporter la démarque en Excel" frontend/js/pages/losses.js
          grep -q "Exporter Excel" frontend/js/pages/inventory.js
          ! grep -q "Envoyer l’ajustement Dynamics" frontend/js/pages/inventory.js
          ! grep -q "Confirmer l’import ERP" frontend/js/pages/losses.js
          grep -Eq "BUILD_LABEL='2\\.[0-9]+\\.[0-9]+'" frontend/js/auth-entry.js
          grep -Eq "STOREOPS_RELEASE_BUILD=.*[0-9]{4}" frontend/netlify-build.sh
