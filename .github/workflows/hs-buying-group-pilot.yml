name: H&S Buying Group Pilot Contract

on:
  pull_request:
    paths:
      - "frontend/js/pages/buying-group.js"
      - "frontend/js/pages/buying-group-management.js"
      - "frontend/js/api.js"
      - "backend/services/buying-group-api.mjs"
      - "backend/services/buying-group-d365.mjs"
      - "backend/services/buying-group-contract-workflow.mjs"
      - "frontend/js/pages/buying-group-workflows.js"
      - "tests/buying-group-contract-workflow.test.mjs"
      - "tests/buying-group-d365.test.mjs"
      - "netlify/functions/api.mts"
      - "netlify/database/migrations/**"
      - "frontend/buying-group.css"
      - "frontend/index.html"
      - "frontend/director-workspaces.css"
      - "frontend/centrale-achat/**"
      - "frontend/_redirects"
      - "frontend/js/auth.js"
      - "frontend/js/app.js"
      - "tests/buying-group.test.mjs"
      - "tests/buying-group-operations.test.mjs"
      - "tests/buying-group-purchases.test.mjs"
      - "frontend/js/pages/buying-group-purchases.js"
      - "frontend/js/pages/buying-group-csv.js"
      - ".github/workflows/hs-buying-group-pilot.yml"
  push:
    branches: [main]
    paths:
      - "frontend/js/pages/buying-group.js"
      - "frontend/js/pages/buying-group-management.js"
      - "frontend/js/api.js"
      - "backend/services/buying-group-api.mjs"
      - "backend/services/buying-group-d365.mjs"
      - "backend/services/buying-group-contract-workflow.mjs"
      - "frontend/js/pages/buying-group-workflows.js"
      - "tests/buying-group-contract-workflow.test.mjs"
      - "tests/buying-group-d365.test.mjs"
      - "netlify/functions/api.mts"
      - "netlify/database/migrations/**"
      - "frontend/buying-group.css"
      - "frontend/index.html"
      - "frontend/director-workspaces.css"
      - "frontend/centrale-achat/**"
      - "frontend/_redirects"
      - "frontend/js/auth.js"
      - "frontend/js/app.js"
      - "tests/buying-group.test.mjs"
      - "tests/buying-group-operations.test.mjs"
      - "tests/buying-group-purchases.test.mjs"
      - "frontend/js/pages/buying-group-purchases.js"
      - "frontend/js/pages/buying-group-csv.js"
      - ".github/workflows/hs-buying-group-pilot.yml"

permissions:
  contents: read

jobs:
  verify-buying-group:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check frontend/js/app.js
          node --check frontend/js/pages/buying-group.js
          node --check frontend/js/pages/buying-group-management.js
          node --check frontend/js/pages/buying-group-purchases.js
          node --check frontend/js/pages/buying-group-csv.js
          node --check backend/services/buying-group-purchases.mjs
          node --check backend/services/buying-group-api.mjs
          node --check backend/services/buying-group-d365.mjs
          node --check backend/services/buying-group-contract-workflow.mjs
          node --check frontend/js/pages/buying-group-workflows.js
          node --check tests/buying-group-contract-workflow.test.mjs
          node --check frontend/js/api.js
          node --check frontend/centrale-achat/entry.js
          node --check tests/buying-group.test.mjs
      - name: Buying Group regression contract
        run: node --test tests/buying-group.test.mjs tests/buying-group-operations.test.mjs tests/buying-group-purchases.test.mjs tests/buying-group-d365.test.mjs tests/buying-group-contract-workflow.test.mjs
