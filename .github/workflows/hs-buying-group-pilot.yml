name: H&S Buying Group Pilot Contract

on:
  pull_request:
    paths:
      - "frontend/js/pages/buying-group.js"
      - "frontend/buying-group.css"
      - "frontend/index.html"
      - "frontend/js/app.js"
      - "tests/buying-group.test.mjs"
      - ".github/workflows/hs-buying-group-pilot.yml"
  push:
    branches: [main]
    paths:
      - "frontend/js/pages/buying-group.js"
      - "frontend/buying-group.css"
      - "frontend/index.html"
      - "frontend/js/app.js"
      - "tests/buying-group.test.mjs"
      - ".github/workflows/hs-buying-group-pilot.yml"

permissions:
  contents: read

jobs:
  verify-buying-group:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73c9e6fdc83974efc15 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check frontend/js/app.js
          node --check frontend/js/pages/buying-group.js
          node --check tests/buying-group.test.mjs
      - name: Buying Group regression contract
        run: node --test tests/buying-group.test.mjs
