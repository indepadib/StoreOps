name: V2.28 Performance Dimensions Discovery

on:
  pull_request:
    branches: [main]

jobs:
  discovery:
    if: github.head_ref == 'storeops-v2.28-performance-dimensions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect live Business Pulse dimensions
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--franprix-storeops.netlify.app
        run: |
          set -euo pipefail
          code=""
          for i in $(seq 1 60); do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$PREVIEW_URL/api/health" || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          test "$code" = "200"

          curl -sS -H "x-demo-user: u-admin" \
            "$PREVIEW_URL/api/dynamics/probe?entity=ProductCategoryAssignments&top=5&extra=cross-company%3Dtrue" \
            -o /tmp/assignments-probe.json

          curl -sS -H "x-demo-user: u-admin" \
            "$PREVIEW_URL/api/dynamics/probe?entity=ProcurementProductCategories&top=20&extra=cross-company%3Dtrue" \
            -o /tmp/categories-probe.json

          curl -sS -H "x-demo-user: u-admin" \
            "$PREVIEW_URL/api/dynamics/probe?entity=ReleasedProductsV2&top=10&filter=ItemNumber%20eq%20%27HS-006585%27&extra=cross-company%3Dtrue" \
            -o /tmp/product-probe.json

          for store in val-fleuri trefle; do
            curl -sS -H "x-demo-user: u-admin" \
              "$PREVIEW_URL/api/stores/$store/business-pulse?force=1" \
              -o "/tmp/pulse-$store.json"
          done

          node - <<'NODE'
          const fs=require('fs');
          const compact=(p,regex)=>{const x=JSON.parse(fs.readFileSync(p,'utf8'));return{ok:x.ok,rowCount:x.rowCount,error:x.error||x.message||null,rows:(x.rows||[]).map(r=>Object.fromEntries(Object.entries(r||{}).filter(([k,v])=>regex.test(k)&&v!==null&&v!=='')))}};          
          console.log('ASSIGNMENTS PROBE',JSON.stringify(compact('/tmp/assignments-probe.json',/product|item|category|hierarchy|name|id|rec/i),null,2));
          console.log('CATEGORIES PROBE',JSON.stringify(compact('/tmp/categories-probe.json',/category|parent|hierarchy|name|level|path|code|id|rec/i),null,2));
          console.log('PRODUCT PROBE',JSON.stringify(compact('/tmp/product-probe.json',/item|product|name|search|display|description|unit|category|price/i),null,2));
          for(const store of ['val-fleuri','trefle']){
            const p=JSON.parse(fs.readFileSync('/tmp/pulse-'+store+'.json','utf8'));
            const b=p.snapshot?.breakdowns||{};
            const safe={
              store,
              status:p.status,
              departments:(b.departments||[]).slice(0,12),
              categories:(b.categories||[]).slice(0,12),
              products:(b.products||[]).slice(0,12),
              hourly:(b.hourly||[]).slice(0,24)
            };
            console.log(JSON.stringify(safe,null,2));
            if(p.status!=='READY')process.exit(2);
          }
          NODE
