name: V1.87 Read-only GET Contract

on:
  push:
    branches: [storeops-v1.87-readonly-gets]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: node --check backend/services/business-pulse-api.mjs
      - name: Read-only GET contract
        run: node backend/tests/v187-readonly-gets.mjs
      - name: Manager batch regression
        run: node backend/tests/v186-manager-inbox-batch.mjs
      - name: Manager fast-path regression
        run: node backend/tests/v185-manager-home-fast.mjs
      - name: Performance P0 regression
        run: node backend/tests/v184-performance-p0.mjs
      - name: Static guards
        run: |
          grep -q "commercialSync:{ok:false,skipped:true,readOnly:true}" backend/services/business-pulse-api.mjs
          grep -q "cashClosingSummary" backend/services/business-pulse-api.mjs
          ! grep -q "syncCommercialControls" backend/services/business-pulse-api.mjs
