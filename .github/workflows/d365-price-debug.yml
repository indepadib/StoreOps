name: D365 Price Debug

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  price-debug:
    if: github.head_ref == 'storeops-v1.75-promo-live-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for deploy preview price probe
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          BASE="https://deploy-preview-${PR_NUMBER}--franprix-storeops.netlify.app"
          ready=0
          for i in $(seq 1 48); do
            code=$(curl -sS -o /tmp/banana.json -w '%{http_code}' --max-time 30 "$BASE/smoke/d365-price-debug?ean=4012" || true)
            if [ "$code" = "200" ] && grep -q '"agreementCount"' /tmp/banana.json 2>/dev/null; then ready=1; break; fi
            sleep 5
          done
          echo "HTTP $code"
          cat /tmp/banana.json 2>/dev/null || true
          [ "$ready" = "1" ]

      - name: Summarize banana price sources
        run: |
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/banana.json','utf8'));
          console.log(JSON.stringify({ean:x.ean,product:x.product,basePrice:x.basePrice,agreementCount:x.agreementCount,agreements:x.agreements},null,2));
          NODE
