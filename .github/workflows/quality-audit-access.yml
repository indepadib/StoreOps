name: StoreOps Quality Audit Access Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Quality & Audit permissions contract
        run: node backend/tests/quality-audit-access.mjs
