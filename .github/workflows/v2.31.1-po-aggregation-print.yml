name: V2.31.1 PO Aggregation & Print

on:
  pull_request:
    branches: [main]

jobs:
  po-aggregation-print:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Netlify site build command
        env:
          STOREOPS_RELEASE_BUILD: "2311"
          STOREOPS_API_BASE: "https://storeops.ma"
        run: |
          cd frontend
          ./netlify-build.sh
      - name: Syntax
        run: |
          node --check frontend/js/receipt-aggregation.js
          node --check frontend/js/pages/receipts.js
      - name: PO aggregation and print contract
        run: node backend/tests/v2311-po-aggregation-print.mjs
      - name: Safety
        run: |
          grep -q "Vue agrégée" frontend/js/pages/receipts.js
          grep -q "Imprimer tous les PO ouverts" frontend/js/pages/receipts.js
          grep -q "window.print" frontend/js/receipt-aggregation.js
          ! grep -q "postReceiptToDynamics" frontend/js/receipt-aggregation.js
